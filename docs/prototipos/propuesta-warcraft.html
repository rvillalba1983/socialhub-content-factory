<title>Propuesta Warcraft</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;500;600;700&family=Alegreya+Sans:wght@400;500;700&display=swap">
<style>
/* Layout: mapa de estrategia en pixel art a pantalla completa; paneles de piedra tallada; panel lateral (abajo en móvil); centro de control superpuesto. Una sola estética oscura, elegida a propósito. */
:root{
  color-scheme:dark;
  --void:#0a0806; --stone:#3a352e; --stone-d:#1f1b17; --stone-l:#5d564b; --stone-xl:#8a8170; --edge:#0d0a08;
  --gold:#f0c75e; --gold-d:#a9812e; --ink:#efe3c4; --ink-2:#cfc1a0; --ink-3:#9e9277;
  --surface:#2c2722; --surface-2:#1c1915; --line:#4b4337; --accent:#7ad35a; --accent-soft:#22361b;
  --ok:#7ccf5a; --ok-bg:#1c3216; --run:#6cb4ff; --run-bg:#132840; --wait:#f0c24b; --wait-bg:#382c0f;
  --block:#ff9a4a; --block-bg:#3c230f; --err:#ff6150; --err-bg:#401612; --idle:#a89f8c; --idle-bg:#4a4438; --cancel:#857e72; --cancel-bg:#26231f;
  --b-delito:#e3604a; --b-lito:#e0a352;
  --f-display:"Pixelify Sans","Courier New",monospace;
  --f-body:"Alegreya Sans","Trebuchet MS",system-ui,sans-serif;
  --f-mono:"Pixelify Sans","Courier New",monospace;
  --tex:none; --tex2:none;
}
[hidden]{display:none!important}
html{height:100%;box-sizing:border-box}
*,*::before,*::after{box-sizing:inherit}
body{height:100%;background:var(--void);color:var(--ink);font-family:var(--f-body);font-size:15px;display:grid;grid-template-rows:auto 1fr;overflow:hidden}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
h1,h2,h3,h4{font-family:var(--f-display);margin:0;text-wrap:balance;font-weight:600;color:var(--gold);text-shadow:2px 2px 0 #000}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.ic{width:14px;height:14px;flex:none;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:square;stroke-linejoin:miter}

/* Piedra tallada: el material de toda la interfaz */
.top,.st,.promo,.res,.float,.panel,.card,.day,.results,.toast,.roadsign,.qchip,.tbl-wrap{
  background:var(--tex),var(--stone);background-size:48px;image-rendering:pixelated;
  border:3px solid var(--edge);border-radius:0;
  box-shadow:inset 2px 2px 0 var(--stone-xl),inset -2px -2px 0 var(--stone-d),0 4px 0 rgba(0,0,0,.55)}
.st,.promo,.res,.panel,.card{position:relative}
.st::after,.promo::after,.res::after,.card::after,.panel::after{content:"";position:absolute;inset:5px;pointer-events:none;
  background:radial-gradient(circle,var(--gold-d) 0 2px,#000 2px 3px,transparent 3.5px) 0 0/8px 8px no-repeat,
  radial-gradient(circle,var(--gold-d) 0 2px,#000 2px 3px,transparent 3.5px) 100% 0/8px 8px no-repeat,
  radial-gradient(circle,var(--gold-d) 0 2px,#000 2px 3px,transparent 3.5px) 0 100%/8px 8px no-repeat,
  radial-gradient(circle,var(--gold-d) 0 2px,#000 2px 3px,transparent 3.5px) 100% 100%/8px 8px no-repeat}
.well{background:rgba(0,0,0,.38);border:2px solid var(--edge);box-shadow:inset 1px 1px 0 #000,inset -1px -1px 0 var(--stone-l)}
.btn,.ibtn,.seg button,.open-cc,.chip,.mini-acts button,.tabs button,.qrow,.rc,.ev{
  font-family:var(--f-display);color:var(--gold);background:linear-gradient(#4a443a,#36312a);border:2px solid var(--edge);border-radius:0;
  box-shadow:inset 2px 2px 0 var(--stone-xl),inset -2px -2px 0 var(--stone-d);text-shadow:1px 1px 0 #000}
.btn:hover,.ibtn:hover,.seg button:hover,.open-cc:hover,.chip:hover,.mini-acts button:hover,.qrow:hover,.rc:hover,.ev:hover{filter:brightness(1.15)}
.btn:active,.ibtn:active,.seg button:active,.open-cc:active,.chip:active,.mini-acts button:active{box-shadow:inset 2px 2px 0 var(--stone-d),inset -2px -2px 0 var(--stone-xl)}
.btn.primary,.open-cc,.seg button.on,.chip.on,.tabs button.on{background:linear-gradient(#7a5f22,#5a4416);color:#fff1c2;box-shadow:inset 2px 2px 0 #c9a04a,inset -2px -2px 0 #2f230b}
.btn.danger{color:var(--err)}
button:disabled{opacity:.45;cursor:default;filter:none}

/* Barra superior */
.top{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;padding-block:9px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));position:relative;z-index:30;border-width:0 0 3px;box-shadow:inset 0 -2px 0 var(--stone-d),inset 0 2px 0 var(--stone-xl),0 3px 0 rgba(0,0,0,.6)}
.mark{display:flex;align-items:center;gap:8px;font-family:var(--f-display);font-weight:700;font-size:21px;color:var(--gold);text-shadow:2px 2px 0 #000;border:0;background:none;padding:0}
.mark i{width:24px;height:24px;background:#5a4416;border:2px solid var(--edge);box-shadow:inset 2px 2px 0 #c9a04a,inset -2px -2px 0 #2f230b;display:grid;place-items:center}
.mark i::before{content:"";width:8px;height:8px;background:var(--gold);box-shadow:2px 2px 0 #000}
.crumbs{display:flex;align-items:center;gap:4px;min-width:0;flex:1 1 220px;color:var(--ink-2);font-size:14px;overflow:hidden}
.crumbs button{border:0;background:none;padding:3px 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:240px;color:var(--ink-2)}
.crumbs button:hover{color:var(--ink);background:rgba(0,0,0,.3)}
.crumbs button:not(.cur){flex-shrink:0}
.crumbs .cur{color:var(--gold);font-family:var(--f-display)}
.crumbs .sep{color:var(--ink-3)}
.demo{font-family:var(--f-display);font-size:12px;letter-spacing:.04em;color:var(--wait);background:rgba(0,0,0,.45);border:2px solid var(--wait);padding:3px 8px;white-space:nowrap}
.search{position:relative;flex:0 1 280px;min-width:160px}
.search input{width:100%;padding:7px 10px 7px 30px;border-radius:0;color:var(--ink)}
.search input{background:rgba(0,0,0,.45);border:2px solid var(--edge);box-shadow:inset 1px 1px 0 #000,inset -1px -1px 0 var(--stone-l)}
.search input::placeholder{color:var(--ink-3)}
.search .ic{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--ink-3)}
.results{position:absolute;top:calc(100% + 6px);left:0;right:0;min-width:280px;padding:6px;max-height:60vh;overflow:auto;z-index:50}
.results button{display:flex;gap:8px;align-items:flex-start;width:100%;text-align:left;border:0;background:none;padding:8px;color:var(--ink)}
.results button:hover,.results button.on{background:rgba(0,0,0,.4);outline:1px solid var(--gold-d)}
.results small{display:block;color:var(--gold);font-family:var(--f-display);font-size:11px}
.results .none{padding:10px;color:var(--ink-3)}
.ctrls{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.seg{display:flex;gap:3px}
.seg button{padding:5px 10px;font-size:14px}
.ibtn{height:32px;min-width:32px;display:grid;place-items:center;padding:0 8px}
.zpct{font-size:14px;color:var(--ink-2);min-width:44px;text-align:center}

/* Mapa */
.vp{position:relative;overflow:hidden;touch-action:none;cursor:grab;background:var(--void)}
.vp.grabbing{cursor:grabbing}
.world{position:absolute;left:0;top:0;transform-origin:0 0;width:2784px}
.terrain,.anim{position:absolute;left:0;image-rendering:pixelated;image-rendering:crisp-edges;pointer-events:none}
.terrain,.anim{top:0;width:2784px;height:2000px}
.bld{position:absolute;background:none;border:0;padding:0;cursor:pointer}
.bld::before{content:"";position:absolute;inset:-4px;opacity:0;transition:opacity .15s;
  background:linear-gradient(var(--accent),var(--accent)) 0 0/22px 4px no-repeat,linear-gradient(var(--accent),var(--accent)) 0 0/4px 22px no-repeat,
  linear-gradient(var(--accent),var(--accent)) 100% 0/22px 4px no-repeat,linear-gradient(var(--accent),var(--accent)) 100% 0/4px 22px no-repeat,
  linear-gradient(var(--accent),var(--accent)) 0 100%/22px 4px no-repeat,linear-gradient(var(--accent),var(--accent)) 0 100%/4px 22px no-repeat,
  linear-gradient(var(--accent),var(--accent)) 100% 100%/22px 4px no-repeat,linear-gradient(var(--accent),var(--accent)) 100% 100%/4px 22px no-repeat}
.bld:hover::before{opacity:.5}.bld.sel::before{opacity:1}
.bflag{position:absolute;left:50%;top:calc(100% + 4px);transform:translateX(-50%);white-space:nowrap}
.roadsign{position:absolute;transform:translateX(-50%);padding:6px 14px;font-family:var(--f-display);color:var(--gold);font-size:15px;white-space:nowrap;text-shadow:1px 1px 0 #000;
  background:linear-gradient(#6a4423,#4b2f16);box-shadow:inset 2px 2px 0 #9c6a3a,inset -2px -2px 0 #2e1c0c,0 4px 0 rgba(0,0,0,.55)}
.qchip{position:absolute;transform:translateX(-50%);padding:2px 8px;font-family:var(--f-display);font-size:13px;color:var(--wait);white-space:nowrap}

/* Estaciones: panel de piedra bajo cada edificio */
.st{position:absolute;width:300px;cursor:pointer}
.st.sel{outline:3px solid var(--accent);outline-offset:3px}
.st-h{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;align-items:center;padding:14px 16px 8px}
.st-n{font-family:var(--f-mono);font-size:14px;color:var(--ink-3)}
.st-h h3{font-size:20px;line-height:1.1}
.st-h .bname{grid-column:2;font-size:12px;color:var(--ink-3);font-family:var(--f-display)}
.st-what{margin:0 16px 10px;color:var(--ink-2);font-size:13.5px;line-height:1.45}
.st-note{margin:0 16px 10px;font-size:13px;color:var(--ink);line-height:1.4;padding:7px 9px}
.st-note{background:rgba(0,0,0,.38);border:2px solid var(--edge);box-shadow:inset 1px 1px 0 #000,inset -1px -1px 0 var(--stone-l)}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:0 16px 12px}
.kpi{padding:6px 7px;min-width:0;background:rgba(0,0,0,.38);border:2px solid var(--edge);box-shadow:inset 1px 1px 0 #000,inset -1px -1px 0 var(--stone-l)}
.kpi b{display:block;font-family:var(--f-display);font-size:22px;font-weight:600;line-height:1.1;text-shadow:1px 1px 0 #000}
.kpi span{font-size:11px;color:var(--ink-3)}
.kpi.k-run b{color:var(--run)} .kpi.k-wait b{color:var(--wait)} .kpi.k-block b{color:var(--block)} .kpi.k-err b{color:var(--err)}
.kpi.zero b{color:var(--ink-3);opacity:.55}
.tasks{list-style:none;margin:0;padding:0 12px 12px;display:grid;gap:6px}
.tk{padding:8px 9px;display:grid;gap:5px;position:relative;background:rgba(0,0,0,.38);border:2px solid var(--edge);box-shadow:inset 1px 1px 0 #000,inset -1px -1px 0 var(--stone-l)}
.tk:hover{border-color:var(--gold-d)}
.tk.sel{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent)}
.tk-top{display:flex;gap:7px;align-items:flex-start}
.tk-title{font-weight:500;font-size:13.5px;line-height:1.3;color:var(--ink)}
.tk-meta{display:flex;gap:5px;flex-wrap:wrap;align-items:center}
.tag{font-family:var(--f-display);font-size:11px;padding:1px 6px;border:2px solid currentColor;line-height:1.3;background:rgba(0,0,0,.4)}
.tag.b-delito{color:var(--b-delito)} .tag.b-litoques{color:var(--b-lito)} .tag.b-none{color:var(--ink-3)}
.agent{display:inline-flex;gap:4px;align-items:center;font-size:11.5px;color:var(--ink-2);background:rgba(0,0,0,.35);padding:1px 6px;border:1px solid var(--line)}
.agent .ic{width:11px;height:11px}
.why{font-size:12.5px;color:var(--ink-2);line-height:1.4}
.bar{height:8px;background:#000;border:1px solid var(--edge);box-shadow:inset 1px 1px 0 #000}
.bar i{display:block;height:100%;background:repeating-linear-gradient(90deg,var(--ok) 0 5px,#4f9a35 5px 6px);transition:width .6s steps(8)}
.prog{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;font-size:12px;color:var(--ink-2)}
.deep{display:grid;gap:7px;padding-top:6px;border-top:2px dashed var(--line)}
.steps{list-style:none;margin:0;padding:0;display:grid;gap:3px}
.steps li{display:flex;gap:6px;font-size:12px;line-height:1.35;color:var(--ink-2)}
.steps li.d{color:var(--ink-3)} .steps li.c{color:var(--gold)} .steps li.f{color:var(--err)}
.steps .ic{width:11px;height:11px;margin-top:2px}
.facts{display:grid;grid-template-columns:auto 1fr;gap:2px 8px;font-size:11.5px;margin:0}
.facts dt{color:var(--ink-3)} .facts dd{margin:0;color:var(--ink-2)}
.mini-acts{display:flex;gap:4px;flex-wrap:wrap}
.mini-acts button{font-size:12px;padding:3px 7px}
.st-res{padding:0 16px 14px;display:grid;gap:6px;font-size:12.5px;color:var(--ink-2)}
.st-res .chips{display:flex;flex-wrap:wrap;gap:4px}
.st-big{padding:2px 16px 16px;display:grid;gap:8px}
.st-big .line{font-size:14px;color:var(--ink-2)}

/* Zoom semántico */
.vp[data-lod="1"] .min-2,.vp[data-lod="1"] .only-2,.vp[data-lod="1"] .only-3{display:none}
.vp[data-lod="2"] .only-1,.vp[data-lod="2"] .only-3{display:none}
.vp[data-lod="3"] .only-1,.vp[data-lod="3"] .only-2{display:none}
.vp[data-lod="1"] .st-h{padding:20px 22px 10px}
.vp[data-lod="1"] .st-h h3{font-size:36px}
.vp[data-lod="1"] .st-h .bname{font-size:18px}
.vp[data-lod="1"] .st-n{font-size:22px}
.vp[data-lod="1"] .bflag .pill{font-size:22px;padding:5px 12px;gap:8px;border-width:3px}
.vp[data-lod="1"] .bflag .pill .ic{width:22px;height:22px}
.vp[data-lod="1"] .kpis{grid-template-columns:repeat(2,1fr);gap:8px;padding:4px 22px 14px}
.vp[data-lod="1"] .kpi{padding:10px 12px}
.vp[data-lod="1"] .kpi b{font-size:48px}
.vp[data-lod="1"] .kpi span{font-size:18px}
.vp[data-lod="1"] .st-big .line{font-size:20px;line-height:1.35}
.vp[data-lod="1"] .st-big{padding:0 22px 22px}
.vp[data-lod="1"] .roadsign{font-size:26px;padding:8px 20px}
.vp[data-lod="1"] .qchip{font-size:20px}

/* Promociones y recursos */
.promo{position:absolute;top:0;width:740px;padding:20px 22px;display:grid;gap:12px;cursor:pointer}
.promo:hover{filter:brightness(1.06)}
.promo-head{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:start}
.banner{width:56px;height:88px;image-rendering:pixelated;display:block}
.promo .eyebrow{font-family:var(--f-display);font-size:13px;color:var(--pc);text-shadow:1px 1px 0 #000;margin-bottom:4px}
.promo h2{font-size:30px}
.promo .sub{color:var(--ink-2);font-size:14px;margin-top:6px}
.promo-row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.stack{display:flex;height:12px;background:#000;border:2px solid var(--edge)}
.stack i{display:block;height:100%}
.legend-row{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12.5px;color:var(--ink-2)}
.legend-row span{display:inline-flex;align-items:center;gap:5px}
.legend-row span::before{content:"";width:9px;height:9px;background:var(--c);border:1px solid #000}
.timeline{position:relative;height:28px}
.timeline .rail{position:absolute;left:0;right:0;top:11px;height:6px;background:#000;border:1px solid var(--edge)}
.timeline .done{position:absolute;left:0;top:12px;height:4px;background:var(--pc)}
.timeline .ms{position:absolute;top:6px;width:3px;height:16px;background:var(--ink-3)}
.timeline .now{position:absolute;top:1px;width:5px;height:26px;background:var(--gold);border:1px solid #000}
.promo-facts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.promo-facts div{padding:9px 11px;min-width:0;background:rgba(0,0,0,.38);border:2px solid var(--edge);box-shadow:inset 1px 1px 0 #000,inset -1px -1px 0 var(--stone-l)}
.promo-facts small{display:block;font-size:12px;color:var(--ink-3)}
.promo-facts b{font-family:var(--f-display);font-size:16px;font-weight:500}
.open-cc{justify-self:start;padding:8px 14px;font-size:15px}
.vp[data-lod="1"] .promo h2{font-size:46px}
.vp[data-lod="1"] .promo .eyebrow{font-size:20px}
.vp[data-lod="1"] .promo .sub{font-size:20px}
.vp[data-lod="1"] .banner{width:84px;height:132px}
.vp[data-lod="1"] .promo-facts b{font-size:24px}
.vp[data-lod="1"] .promo-facts small{font-size:16px}
.vp[data-lod="1"] .legend-row{font-size:17px}
.vp[data-lod="1"] .open-cc{font-size:20px;padding:10px 18px}
.res{position:absolute;top:0;left:1560px;width:1470px;padding:20px 22px;display:grid;gap:12px}
.res h2{font-size:24px}
.res .sub{color:var(--ink-2);font-size:14px}
.res-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px}
.rc{padding:9px 10px;text-align:left;display:grid;gap:4px;min-width:0;color:var(--ink)}
.rc b{font-size:14px;font-weight:500;color:var(--gold)}
.rc small{font-family:var(--f-body);font-size:12px;color:var(--ink-2);line-height:1.35;text-shadow:none}
.vp[data-lod="1"] .res h2{font-size:36px}
.vp[data-lod="1"] .res .sub{font-size:20px}
.vp[data-lod="1"] .rc b{font-size:20px}
.vp[data-lod="1"] .rc small{font-size:15px}

/* Estados */
.pill{display:inline-flex;align-items:center;gap:5px;font-family:var(--f-display);font-size:13px;padding:2px 8px;white-space:nowrap;color:var(--c);background:rgba(0,0,0,.6);border:2px solid var(--c);text-shadow:1px 1px 0 #000}
.s-ok{--c:var(--ok);--cb:var(--ok-bg)}
.s-run{--c:var(--run);--cb:var(--run-bg)}
.s-wait{--c:var(--wait);--cb:var(--wait-bg)}
.s-block{--c:var(--block);--cb:var(--block-bg)}
.s-err{--c:var(--err);--cb:var(--err-bg)}
.s-idle{--c:var(--idle);--cb:var(--idle-bg)}
.s-cancel{--c:var(--cancel);--cb:var(--cancel-bg)}
.s-cancel .tk-title{text-decoration:line-through;color:var(--ink-3)}
.dot{width:18px;height:18px;display:grid;place-items:center;color:var(--c);background:rgba(0,0,0,.6);border:2px solid var(--c);flex:none}
.dot .ic{width:10px;height:10px}
.spin{animation:spin 1.6s steps(8) infinite;transform-origin:center}
@keyframes spin{to{transform:rotate(360deg)}}

/* Flotantes */
.float{position:absolute;z-index:5}
.legend{left:calc(12px + env(safe-area-inset-left,0px));bottom:calc(12px + env(safe-area-inset-bottom,0px));padding:8px 10px;display:flex;flex-wrap:wrap;gap:6px;max-width:min(620px,calc(100% - 24px))}
.hint{right:calc(12px + env(safe-area-inset-right,0px));bottom:calc(12px + env(safe-area-inset-bottom,0px));padding:7px 12px;font-size:13px;color:var(--ink-2)}
@media (max-width:760px){.hint{display:none}.legend .pill span{display:none}}

/* Panel lateral */
.panel{position:absolute;top:0;right:0;bottom:0;width:430px;max-width:100%;z-index:20;display:flex;flex-direction:column;padding-right:env(safe-area-inset-right,0px);border-width:0 0 0 3px}
.panel-h{display:flex;gap:10px;align-items:flex-start;padding:18px 20px 12px;border-bottom:2px solid var(--edge);box-shadow:0 2px 0 var(--stone-l)}
.panel-h h2{font-size:21px;flex:1;line-height:1.2}
.panel-h small{display:block;font-size:12px;color:var(--ink-3);margin-bottom:5px;font-family:var(--f-display)}
.panel-b{overflow:auto;padding:14px 20px 24px;display:grid;gap:16px;align-content:start}
.panel-b section{display:grid;gap:7px}
.panel-b h4{font-size:13px;color:var(--gold)}
.panel-b p{margin:0;line-height:1.5;color:var(--ink-2)}
.panel-b ul{margin:0;padding-left:18px;color:var(--ink-2);line-height:1.5}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:14px;margin:0}
.kv dt{color:var(--ink-3)} .kv dd{margin:0;min-width:0;color:var(--ink)}
.panel .steps li{font-size:14px}
.panel .steps .ic{width:13px;height:13px;margin-top:3px}
.log{list-style:none;margin:0;padding:0;display:grid;gap:6px;font-size:13.5px}
.log li{display:grid;grid-template-columns:48px 1fr;gap:8px;color:var(--ink-2)}
.log time{font-family:var(--f-mono);color:var(--ink-3);font-size:13px}

function polyLen(p){let L=0;for(let i=1;i<p.length;i++)L+=Math.abs(p[i][0]-p[i-1][0])+Math.abs(p[i][1]-p[i-1][1]);return L}
function polyAt(p,d){for(let i=1;i<p.length;i++){const sl=Math.abs(p[i][0]-p[i-1][0])+Math.abs(p[i][1]-p[i-1][1]);if(d<=sl||i===p.length-1){const q=sl?Math.min(1,d/sl):0;return[p[i-1][0]+(p[i][0]-p[i-1][0])*q,p[i-1][1]+(p[i][1]-p[i-1][1])*q]}d-=sl}return p[p.length-1]}

const terrainCv=document.createElement('canvas');terrainCv.width=MW;terrainCv.height=MH;terrainCv.className='terrain';
const POND={cx:345,cy:229,rx:42,ry:13};
function drawTerrain(){
 cur=terrainCv.getContext('2d');offY=0;const R=rng(11);
 const cell=12,gw=Math.ceil(MW/cell)+2,G=[...Array(gw*(Math.ceil(MH/cell)+2))].map(()=>R());
 const nz=(x,y)=>{const cx=x/cell,cy=y/cell,x0=Math.floor(cx),y0=Math.floor(cy),fx=cx-x0,fy=cy-y0,v=(i,j)=>G[j*gw+i],a=v(x0,y0),b=v(x0+1,y0),c=v(x0,y0+1),d=v(x0+1,y0+1),sx=fx*fx*(3-2*fx),sy=fy*fy*(3-2*fy);return a+(b-a)*sx+(c-a)*sy+(a-b-c+d)*sx*sy};
 const dirt=[[RD.x0,RD.top,RD.x1+14,RD.top+RD.h],[RD.x0,RD.bot,RD.x1+14,RD.bot+RD.h],[RD.x0,RD.top,RD.x0+RD.h,RD.bot+RD.h]];
 for(let i=0;i<8;i++){const o=ox(i),y=oyb(i);dirt.push([o-3,y+40,o+64,y+52])}
 const inDirt=(x,y)=>{const e=(G[(y*7+x*13)%G.length]-.5)*3;return dirt.some(([a,b,c,d])=>x>=a-e&&x<=c+e&&y>=b-e&&y<=d+e)};
 const inPond=(x,y,k=1)=>((x-POND.cx)/(POND.rx*k))**2+((y-POND.cy)/(POND.ry*k))**2<=1;
 const grass=[[50,88,34],[58,100,39],[66,111,43],[76,123,49]],soil=[[96,69,40],[110,80,46],[124,92,54],[138,104,62]];
 const img=cur.createImageData(MW,MH),d=img.data;
 for(let y=0;y<MH;y++)for(let x=0;x<MW;x++){const n=nz(x,y)*.72+R()*.28,ix=Math.max(0,Math.min(3,Math.floor(n*4)));let p=(inDirt(x,y)?soil:grass)[ix];
  if(inPond(x,y,1.12))p=[104,82,50];if(inPond(x,y)){p=n>.6?[66,120,168]:[48,96,146];if(y<POND.cy-POND.ry+3)p=[34,66,104]}
  const k=(y*MW+x)*4;d[k]=p[0];d[k+1]=p[1];d[k+2]=p[2];d[k+3]=255}
 cur.putImageData(img,0,0);
 // bordes de los caminos: luz arriba, sombra abajo
 [[RD.top],[RD.bot]].forEach(([y])=>{r(RD.x0,y-1,RD.x1+14-RD.x0,1,'rgba(255,240,200,.12)');r(RD.x0,y+RD.h,RD.x1+14-RD.x0,1,'rgba(0,0,0,.25)')});
 r(RD.x0+RD.h,RD.top,1,RD.bot-RD.top,'rgba(0,0,0,.2)');
 for(let k=0;k<3600;k++){const x=Math.floor(R()*MW),y=Math.floor(R()*MH);if(inDirt(x,y)||inPond(x,y,1.15))continue;const q=R();
  if(q<.75)r(x,y,1,2,'#2b5320');else if(q<.86)r(x,y,1,1,'#e9d36a');else if(q<.93)r(x,y,1,1,'#efe9df');else{r(x,y,3,2,'#6d6a62');r(x,y,2,1,'#a8a498');r(x+2,y+1,1,1,'#3c3a35')}}
 for(let k=0;k<900;k++){const x=Math.floor(R()*MW),y=Math.floor(R()*MH);if(inDirt(x,y))r(x,y,1,1,R()<.5?'#5a4128':'#a3815a')}
 // juncos de la charca
 for(let k=0;k<26;k++){const a=R()*Math.PI*2,x=POND.cx+Math.cos(a)*POND.rx*1.1,y=POND.cy+Math.sin(a)*POND.ry*1.1;r(x,y-3,1,3,'#3f6b2a');r(x,y-4,1,1,'#7a5228')}
 const trees=[],busy=(x,y)=>inDirt(x,y)||inPond(x,y,1.3)||inDirt(x,y-6);
 const add=(x,y)=>{if(!busy(x,y))trees.push([Math.round(x),Math.round(y)])};
 for(let i=0;i<4;i++){if(i<3){const gx=(ox(i)+60+ox(i+1))/2;add(gx-4,BL[0]-10);add(gx+6,BL[0]-20);add(gx-6,BL[1]-10);add(gx+5,BL[1]-22)}}
 for(let y=RD.top+18;y<oyb(4)-6;y+=7)for(let x=RD.x0+16;x<RD.x1;x+=11)if(R()<.42)add(x+R()*6,y+R()*3);
 for(let y=0;y<MH;y+=9)for(let x=RD.x0-12;x<RD.x0-2;x+=10)add(x+R()*3,y+R()*3);
 for(let y=0;y<MH;y+=9)for(let x=RD.x1+16;x<RD.x1+22;x+=10)add(x,y+R()*3);

const animCv=document.createElement('canvas');animCv.width=MW;animCv.height=MH;animCv.className='anim';
function stVis(s){const c=counts(s.id);return{s:s.status,run:c.run>0&&!s.paused,err:c.err>0,alert:c.err>0?'err':s.status==='block'?'block':null}}
function ring(cx,cy,rx,ry,c){for(let a=0;a<Math.PI*2;a+=Math.PI/(rx*1.6))r(cx+Math.cos(a)*rx,cy+Math.sin(a)*ry,2,1,c)}
function drawAnim(t){
 cur=animCv.getContext('2d');offY=0;cur.clearRect(0,0,MW,MH);

 // camino de vuelta
 const ret=ST('ret'),loopOn=ret.status!=='wait'&&!ret.paused,L=polyLen(LOOP);
 for(let k=0;k<4;k++){const d=loopOn?(t*.005+k*L/4)%L:k*L/4,[x,y]=polyAt(LOOP,d);worker(x-2,y+2,k%2?'#3d5c99':'#8a3a2a',loopOn?(f+k)%2:0,true)}
 // cintas
 BELTS.forEach((p,i)=>{const A=STATIONS[i],B=STATIONS[i+1],va=stVis(A),vb=stVis(B),moving=va.run||vb.run,jam=!moving&&(vb.alert||va.alert);
  drawBelt(p,moving,f);const Lb=polyLen(p);
  if(moving){const brands=TASKS.filter(x=>(x.st===A.id||x.st===B.id)&&x.status==='run').map(x=>x.promo||'none');
   for(let k=0;k<4;k++){const d=(t*.008+k*Lb/4)%Lb;if(d>Lb-5)continue;const[x,y]=polyAt(p,d);crate(x,y-5,BRPX[brands[k%brands.length]||'none'])}}
  else{const q=TASKS.filter(x=>x.st===B.id&&(x.status==='wait'||x.status==='block')).length;
   for(let k=0;k<Math.min(q,3);k++){const[x,y]=polyAt(p,Lb-6-k*6);const sh=jam?((f+k)%2?1:-1):0;crate(x+sh,y-5,'#7d756a')}}
 });
 // edificios
 STATIONS.forEach((s,i)=>{const v=stVis(s),b=BLD[s.id],o=ox(i),y=oyb(i);
  if(v.alert){const ph=(t%1300)/1300,col=v.alert==='err'?'#ff3d2a':'#ff9a3a';cur.globalAlpha=1-ph;ring(o+30,y+47,30+ph*16,6+ph*4,col);cur.globalAlpha=(1-((ph+.5)%1));ring(o+30,y+47,30+((ph+.5)%1)*16,6+((ph+.5)%1)*4,col);cur.globalAlpha=1}
  b.draw(o,y,v.run);
  if(b.forge&&v.run){const up=f%2;worker(o+44,y+48,'#5a3a1e',0,false);r(o+48,y+(up?37:41),1,4,PC.woodD);r(o+47,y+(up?36:40),3,2,'#55555a');if(!up){r(o+50,y+42,1,1,'#ffd24a');r(o+52,y+41,1,1,'#ff9a1a')}}
  if(b.clock){const[cx,cy]=b.clock,m=(clock%60)/60*Math.PI*2-Math.PI/2,h=((clock/60)%12)/12*Math.PI*2-Math.PI/2;
   for(let d=1;d<=4;d++)r(o+cx+Math.cos(m)*d,y+cy+Math.sin(m)*d,1,1,PC.dark);for(let d=1;d<=2;d++)r(o+cx+Math.cos(h)*d,y+cy+Math.sin(h)*d,1,1,'#7a1d15')}
  if(b.hub){const[hx,hy]=b.hub,spd=(v.run||v.s==='ok')&&!s.paused?.0011:0,an=t*spd;

  view.s=f.s+(t.s-f.s)*p;view.tx=f.tx+(t.tx-f.tx)*p;view.ty=f.ty+(t.ty-f.ty)*p;apply();if(p<1)anim=requestAnimationFrame(step)};

 }
 if(ccState.tab==='config'){
  body=`<div class="tbl-wrap"><table><thead><tr><th>Parámetro</th><th>Valor</th><th>Origen</th></tr></thead><tbody>${pr.config.map(([a,v,o])=>`<tr><td class="nowrap">${esc(a)}</td><td>${esc(v)}</td><td>${o==='Marca'?'Heredado de la marca':'Propio de la promoción'}</td></tr>`).join('')}</tbody></table></div>`;
 }
 cc.innerHTML=`<div class="cc-in" style="--pc:${b.c}">
  <div><button class="btn back" data-act="closecc">${ic('back')}Volver al mapa</button></div>
  <div class="cc-head"><div><div class="eyebrow">${b.name} · ${b.handle}</div><h1>${esc(pr.name)}</h1><p>${esc(pr.range)} · ${esc(pr.phase)}</p><p>${esc(pr.desc)}</p></div><div class="promo-row">${pill('ok','Activa')}<span class="pill s-wait">${ic('human')}<span>Supervisada</span></span></div></div>
  <nav class="tabs" role="tablist">${tabs.map(([k,l])=>`<button role="tab" aria-selected="${ccState.tab===k}" class="${ccState.tab===k?'on':''}" data-act="tab" data-tab="${k}">${l}</button>`).join('')}</nav>
  ${body}</div>`;
 if(ccState.hl&&ccState.tab==='publicaciones'){const r=cc.querySelector('#row-'+ccState.hl);r&&r.scrollIntoView({block:'center'})}
}

/* ---------- ruta de navegación ---------- */
function crumbs(){
 const c=[`<button data-act="home" class="${!sel.type&&cc.hidden?'cur':''}">Fábrica</button>`];
 const add=(h,cur)=>c.push(`<span class="sep">/</span>${h.replace('<button','<button class="'+(cur?'cur':'')+'"')}`);
 if(!cc.hidden&&ccState.promo){const pr=PROMOS[ccState.promo];add(`<button data-act="cc" data-promo="${pr.id}">${BR[pr.brand].name}</button>`);add(`<button data-act="cc" data-promo="${pr.id}">${esc(pr.name)}</button>`,true)}
 else if(sel.type==='station'){add(`<button data-act="station" data-st="${sel.id}">${esc(ST(sel.id).name)}</button>`,true)}
 else if(sel.type==='task'){const t=T(sel.id);add(`<button data-act="station" data-st="${t.st}">${esc(ST(t.st).name)}</button>`);add(`<button data-act="task" data-task="${t.id}">${esc(t.title)}</button>`,true)}
 else if(sel.type==='res'){add(`<button>${esc(RES[sel.id].n)}</button>`,true)}
 $('#crumbs').innerHTML='<span class="sep" style="margin-right:2px">SocialHub</span><span class="sep">/</span>'+c.join('');
}

/* ---------- búsqueda ---------- */
const q=$('#q'),results=$('#results');let hits=[],hi=0;
function search(term){
 const n=s=>s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');const k=n(term.trim());if(!k){results.hidden=true;return}
 hits=[];
 STATIONS.forEach(s=>n(s.name+' '+s.what).includes(k)&&hits.push({t:'Estación',l:s.name,go:()=>goStation(s.id)}));
 Object.values(PROMOS).forEach(p=>n(p.name+' '+BR[p.brand].name).includes(k)&&hits.push({t:'Promoción',l:`${BR[p.brand].name} · ${p.name}`,go:()=>openCC(p.id)}));
 TASKS.forEach(t=>n(t.title+' '+(t.goal||'')).includes(k)&&hits.push({t:'Tarea · '+ST(t.st).name,l:t.title,s:t.status,go:()=>goTask(t.id)}));
 PUBS.forEach(x=>n(x.title+' '+x.type).includes(k)&&hits.push({t:`Publicación · ${BR[x.promo].name} · ${lbl(fromIso(x.date))}`,l:x.title,go:()=>openCC(x.promo,'publicaciones',x.id)}));
 RES.forEach((r,i)=>n(r.n+' '+r.d).includes(k)&&hits.push({t:'Herramienta',l:r.n,s:r.s,go:()=>{closeCCIf();sel={type:'res',id:i};openRes(i);crumbs()}}));
 hits=hits.slice(0,10);hi=0;
 results.innerHTML=hits.length?hits.map((h,i)=>`<button data-hit="${i}" class="${i===0?'on':''}">${h.s?dot(h.s):''}<span><small>${esc(h.t)}</small>${esc(h.l)}</span></button>`).join(''):'<div class="none">Sin resultados.</div>';
 results.hidden=false;
}
q.addEventListener('input',()=>search(q.value));
q.addEventListener('keydown',e=>{
 if(e.key==='Escape'){results.hidden=true;q.blur()}
 if(results.hidden||!hits.length)return;
 if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();hi=(hi+(e.key==='ArrowDown'?1:-1)+hits.length)%hits.length;results.querySelectorAll('button').forEach((b,i)=>b.classList.toggle('on',i===hi))}
 if(e.key==='Enter'){e.preventDefault();pick(hi)}
});
results.addEventListener('click',e=>{const b=e.target.closest('[data-hit]');if(b)pick(+b.dataset.hit)});
function pick(i){const h=hits[i];results.hidden=true;q.value='';h&&h.go()}
document.addEventListener('pointerdown',e=>{if(!e.target.closest('.search'))results.hidden=true});

/* ---------- navegación ---------- */
function closeCCIf(){if(!cc.hidden){cc.hidden=true;ccState.promo=null}}
function goStation(id){closeCCIf();select('station',id);renderWorld();openStation(id);crumbs();flyToStation(id)}
function goTask(id){closeCCIf();const t=T(id);select('task',id);renderWorld();openTask(id);crumbs();flyToStation(t.st,Math.max(2.1,view.s))}

document.addEventListener('click',e=>{
 const el=e.target.closest('[data-act]');if(!el)return;
 const a=el.dataset.act,t=el.dataset.task&&T(el.dataset.task);
 if(el.tagName==='LI'&&e.target.closest('button[data-act]')&&e.target.closest('button[data-act]')!==el)return;
 e.stopPropagation();
 switch(a){
  case'home':closeCCIf();panel.hidden=true;sel={type:null,id:null};renderWorld();crumbs();fit();break;
  case'fit':fit();break;
  case'zin':{const v=avail();zoomAt(v.w/2,v.h/2,1.25);break}
  case'zout':{const v=avail();zoomAt(v.w/2,v.h/2,.8);break}
  case'lod':setLod(+el.dataset.v);break;
  case'station':goStation(el.dataset.st);break;
  case'zoomst':flyToStation(el.dataset.st,2.1);break;
  case'task':goTask(el.dataset.task);break;
  case'res':closeCCIf();sel={type:'res',id:+el.dataset.i};renderWorld();openRes(+el.dataset.i);crumbs();break;
  case'close':closePanel();break;
  case'cc':openCC(el.dataset.promo);break;
  case'closecc':closeCC();break;
  case'tab':ccState.tab=el.dataset.tab;ccState.hl=null;renderCC();break;
  case'wk':ccState.week+=+el.dataset.d;renderCC();break;
  case'flt':ccState.filter=el.dataset.f;renderCC();break;
  case'pubjump':ccState.tab='publicaciones';ccState.filter='all';ccState.hl=el.dataset.pub;renderCC();break;
  case'cctask':goTask(el.dataset.task);break;
  case'spause':case'sresume':stationAct(a,ST(el.dataset.st));break;
  case'nocancel':confirmFor=null;openTask(t.id);break;
  default:if(t){if(sel.id!==t.id||sel.type!=='task'){select('task',t.id);if(a==='cancel')confirmFor=null}doAct(a,t)}
 }
});
document.addEventListener('change',e=>{if(e.target.id==='agent-sel'){doAct('agent',T(e.target.dataset.task),e.target.value)}});
document.addEventListener('keydown',e=>{
 if(e.target.closest('input,select,textarea'))return;
 if(e.key==='Enter'&&e.target.matches('.st,.promo')){e.target.click()}
 if(e.key==='0'){fit()} if(e.key==='+'||e.key==='='){const v=avail();zoomAt(v.w/2,v.h/2,1.25)} if(e.key==='-'){const v=avail();zoomAt(v.w/2,v.h/2,.8)}
 if(e.key==='Escape'){if(!cc.hidden)closeCC();else if(!panel.hidden)closePanel()}
});

/* ---------- motor de demostración ---------- */
let toastT;function toast(m){const el=$('#toast');el.textContent=m;el.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>el.hidden=true,2600)}
setInterval(()=>{
 clock+=1;let changed=false;
 TASKS.forEach(t=>{if(t.status!=='run'||t.paused)return;t.progress=Math.min(100,t.progress+.25+Math.random()*.55);
  document.querySelectorAll(`[data-bar="${t.id}"]`).forEach(b=>b.style.width=t.progress+'%');
  document.querySelectorAll(`[data-pct="${t.id}"]`).forEach(b=>b.textContent=Math.floor(t.progress)+'%');
  if(t.progress>=100){t.status='ok';t.steps&&(t.steps=t.steps.map(([n])=>[n,1]));t.result=t.result||'Completada en la simulación.';ev(t,'Completada');changed=true;toast(`Terminada: ${t.title}`)}});
 if(changed){resolveDeps();rerender()}
},1500);

/* ---------- arranque ---------- */
drawTerrain();renderLegend();renderWorld();apply();crumbs();if(!reduced)requestAnimationFrame(animLoop);
requestAnimationFrame(()=>{fit();const h=(location.hash||'').slice(1);if(PROMOS[h])openCC(h)});
let rz;addEventListener('resize',()=>{clearTimeout(rz);rz=setTimeout(fit,150)});
</script>
