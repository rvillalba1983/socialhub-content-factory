name: E2E

# Recorridos reales con navegador (Playwright) contra SocialHub arrancado de verdad: el jar con la web dentro, PostgreSQL
# incluido y los servicios externos (Claude, Drive, Meta) simulados con carpetas temporales. Solo en Linux (es lo más barato).
on:
  push:
    branches: [main]
    paths: ["e2e/**", "frontend/**", "backend/**", "contracts/**", ".github/workflows/e2e.yml"]
  pull_request:
    paths: ["e2e/**", "frontend/**", "backend/**", "contracts/**", ".github/workflows/e2e.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recorridos:
    name: Recorridos con navegador (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: e2e
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
          cache-dependency-path: backend/pom.xml
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            e2e/package-lock.json
            frontend/package-lock.json
      - name: Instalar Playwright y su Chromium
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Compilar la web y empaquetar SocialHub
        run: npm run build:app
      - name: Pasar los recorridos
        run: npm run e2e
        env:
          CI: "true"
      # Si algo falla: capturas, trazas (npx playwright show-trace) y el registro de la app
      - name: Subir capturas y trazas
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-fallos
          path: |
            e2e/test-results/
            e2e/playwright-report/
            e2e/.run/app.log
          retention-days: 14
          if-no-files-found: ignore
