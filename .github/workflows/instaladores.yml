name: Instaladores

# A mano: genera el instalador de Windows (.msi) y, si se pide, el de macOS (.dmg), con Java y PostgreSQL dentro.
# El .msi se instala y se prueba en la propia máquina de GitHub antes de darlo por bueno.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Versión (tres números, por ejemplo 1.0.0)"
        required: true
        default: "1.1.0"
      sistemas:
        description: "Instaladores (macOS gasta x10 minutos)"
        type: choice
        default: windows
        options: [windows, windows-y-macos]
      publicar:
        description: "Publicar en una release de GitHub (privada, como el repositorio)"
        type: boolean
        default: false
  # Al cambiar este workflow en una PR, se prueban el .msi y el .dmg (sin publicar nada)
  pull_request:
    paths: [".github/workflows/instaladores.yml"]

permissions:
  contents: write

env:
  # Identifica el programa entre versiones: el instalador nuevo sustituye al anterior. No cambiar.
  UPGRADE_UUID: cb398502-9514-4d01-b4d8-be1d607e5d9f
  # Sin tildes: WiX usa la página de códigos 1252 del instalador en inglés y rechaza otros caracteres
  DESCRIPCION: "Fabrica de contenido de El DeLito y Litoques"
  FABRICANTE: "Raul Villalba"
  VERSION: ${{ inputs.version || '1.1.0' }}

jobs:
  windows:
    name: Instalador de Windows (.msi)
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Comprobar la versión
        shell: bash
        run: '[[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::La versión tiene que ser de tres números, como 1.0.0"; exit 1; }'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Compilar la web
        working-directory: frontend
        run: |
          npm ci
          npm run build
      - name: Empaquetar SocialHub con la web
        working-directory: backend
        run: mvn -B -DskipTests package
      # jpackage necesita WiX (gratuito) para crear el .msi
      - name: WiX 3.14
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\WiX Toolset v3.14\bin\candle.exe")) { choco install wixtoolset --version 3.14.1 --no-progress -y }
          & "${env:ProgramFiles(x86)}\WiX Toolset v3.14\bin\candle.exe" -? | Select-Object -First 1
      - name: Crear el .msi
        shell: bash
        run: |
          export PATH="$PATH:/c/Program Files (x86)/WiX Toolset v3.14/bin"
          mkdir -p entrada salida
          cp backend/target/socialhub.jar entrada/
          jpackage --type msi --name SocialHub --app-version "$VERSION" \
            --vendor "$FABRICANTE" --description "$DESCRIPCION" \
            --input entrada --main-jar socialhub.jar --dest salida \
            --java-options "-Dsocialhub.desktop=true" \
            --win-menu --win-menu-group SocialHub --win-shortcut \
            --win-upgrade-uuid "$UPGRADE_UUID" --verbose
          ls -la salida
      # El .msi nuevo se instala encima de la versión ya publicada (mismo UPGRADE_UUID) sin desinstalar antes
      - name: Actualizar encima de una versión anterior
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $nuevo = Get-ChildItem salida\*.msi | Select-Object -First 1
          $tag = gh release list --limit 20 --json tagName --jq '.[].tagName' | Where-Object { $_ -ne "v$env:VERSION" } | Select-Object -First 1
          if (-not $tag) { Write-Host "No hay ninguna release anterior: se omite la prueba"; exit 0 }
          New-Item -ItemType Directory -Force anterior | Out-Null
          gh release download $tag --pattern "*.msi" --dir anterior
          $viejo = Get-ChildItem anterior\*.msi | Select-Object -First 1
          if (-not $viejo) { Write-Host "La release $tag no tiene .msi: se omite la prueba"; exit 0 }
          function Instalados { Get-ItemProperty "HKLM:\Software\Microsoft\Windows\CurrentVersion\Uninstall\*" | Where-Object { $_.DisplayName -eq "SocialHub" } }
          $p = Start-Process msiexec.exe -ArgumentList "/i `"$($viejo.FullName)`" /qn" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "No se instaló $($viejo.Name): $($p.ExitCode)" }
          Write-Host "Instalado: $((Instalados).DisplayVersion)"
          $p = Start-Process msiexec.exe -ArgumentList "/i `"$($nuevo.FullName)`" /qn /l*v `"$env:RUNNER_TEMP\actualizar.log`"" -Wait -PassThru
          if ($p.ExitCode -ne 0) { Get-Content "$env:RUNNER_TEMP\actualizar.log" -Tail 40; throw "No se actualizó encima de $($viejo.Name): $($p.ExitCode)" }
          $ins = @(Instalados)
          if ($ins.Count -ne 1 -or $ins[0].DisplayVersion -ne $env:VERSION) { $ins | Format-List DisplayName, DisplayVersion; throw "Tras actualizar tiene que quedar solo SocialHub $env:VERSION" }
          Write-Host "Actualizado encima de $($viejo.Name): queda SocialHub $env:VERSION"
          $u = Start-Process msiexec.exe -ArgumentList "/x `"$($nuevo.FullName)`" /qn" -Wait -PassThru
          if ($u.ExitCode -ne 0) { throw "No se desinstaló tras actualizar: $($u.ExitCode)" }
      # Prueba real: se instala (en Archivos de programa), se abre, responde, no arranca dos veces y se cierra desde la web
      - name: Instalar y probar el .msi
        shell: pwsh
        run: |
          $msi = Get-ChildItem salida\*.msi | Select-Object -First 1
          $p = Start-Process msiexec.exe -ArgumentList "/i `"$($msi.FullName)`" /qn /l*v `"$env:RUNNER_TEMP\instalar.log`"" -Wait -PassThru
          if ($p.ExitCode -ne 0) { Get-Content "$env:RUNNER_TEMP\instalar.log" -Tail 40; throw "msiexec terminó con $($p.ExitCode)" }
          $exe = Join-Path $env:ProgramFiles "SocialHub\SocialHub.exe"
          if (-not (Test-Path $exe)) { Get-ChildItem $env:ProgramFiles | Select-Object -First 40; throw "No está $exe" }
          # Dos clics seguidos: solo arranca uno; el otro espera y termina
          $app = Start-Process $exe -PassThru
          Start-Sleep 2
          $twin = Start-Process $exe -PassThru
          $ok = $false
          for ($i = 0; $i -lt 90; $i++) {
            try { $r = Invoke-WebRequest http://localhost:8686/api/app-mode -UseBasicParsing -TimeoutSec 3; if ($r.StatusCode -eq 200) { $ok = $true; break } } catch {}
            Start-Sleep 2
          }
          $logs = Join-Path $env:LOCALAPPDATA "SocialHub\logs\socialhub.log"
          if (-not $ok) { if (Test-Path $logs) { Get-Content $logs -Tail 60 }; throw "SocialHub instalado no respondió en localhost:8686" }
          Write-Host "Responde: $($r.Content)"
          if (-not $twin.WaitForExit(60000)) { throw "El segundo clic no terminó: arrancarían dos SocialHub" }
          # PostgreSQL lleva al lado las bibliotecas de Visual C++ de Java (hay equipos sin ellas instaladas)
          $pgbin = Join-Path $env:LOCALAPPDATA "SocialHub\runtime\postgres-windows-x86_64\bin"
          foreach ($dll in 'vcruntime140.dll', 'vcruntime140_1.dll', 'msvcp140.dll') {
            if (-not (Test-Path (Join-Path $pgbin $dll))) { throw "Falta $dll junto a PostgreSQL" }
          }
          Write-Host "Bibliotecas de Visual C++ junto a PostgreSQL"
          if (-not (Test-Path $logs)) { throw "No hay registro en $logs" }
          $web = Invoke-WebRequest http://localhost:8686/ -UseBasicParsing
          if ($web.Content -notmatch '<div id="root">') { throw "La web no se sirve" }
          # Segundo arranque: solo abre el navegador y termina
          $second = Start-Process $exe -PassThru
          if (-not $second.WaitForExit(30000)) { throw "El segundo arranque no terminó: arrancaría dos veces" }
          Write-Host "Segundo arranque terminó enseguida, como debe"
          Invoke-WebRequest http://localhost:8686/api/app/shutdown -Method Post -Headers @{ 'X-SocialHub-Request' = '1' } -UseBasicParsing | Out-Null
          if (-not $app.WaitForExit(60000)) { throw "SocialHub no se cerró desde la web" }
          if (Get-Process postgres -ErrorAction SilentlyContinue) { throw "PostgreSQL sigue en marcha después de cerrar" }
          Write-Host "Se cierra desde la web y para PostgreSQL"
          # PostgreSQL descomprimido a medias (le falta un archivo): al abrir se descomprime de nuevo y arranca
          Remove-Item (Join-Path $pgbin "zlib1.dll")
          $again = Start-Process $exe -PassThru
          $ok = $false
          for ($i = 0; $i -lt 90; $i++) {
            try { $r = Invoke-WebRequest http://localhost:8686/api/app-mode -UseBasicParsing -TimeoutSec 3; if ($r.StatusCode -eq 200) { $ok = $true; break } } catch {}
            Start-Sleep 2
          }
          if (-not $ok) { Get-Content $logs -Tail 60; throw "Con PostgreSQL a medias no se recuperó" }
          if (-not (Test-Path (Join-Path $pgbin "zlib1.dll"))) { throw "No se volvió a descomprimir PostgreSQL" }
          Invoke-WebRequest http://localhost:8686/api/app/shutdown -Method Post -Headers @{ 'X-SocialHub-Request' = '1' } -UseBasicParsing | Out-Null
          if (-not $again.WaitForExit(60000)) { throw "SocialHub no se cerró la segunda vez" }
          Write-Host "Con PostgreSQL a medias, lo descomprime de nuevo y arranca"
          # Desinstalar no borra los datos
          $u = Start-Process msiexec.exe -ArgumentList "/x `"$($msi.FullName)`" /qn" -Wait -PassThru
          if ($u.ExitCode -ne 0) { throw "La desinstalación terminó con $($u.ExitCode)" }
          if (-not (Test-Path (Join-Path $env:LOCALAPPDATA "SocialHub\pgdata"))) { throw "Al desinstalar se borraron los datos" }
          Write-Host "Desinstalado; los datos siguen en $env:LOCALAPPDATA\SocialHub"
      - name: Registro de SocialHub
        if: always()
        shell: pwsh
        run: Get-Content (Join-Path $env:LOCALAPPDATA "SocialHub\logs\socialhub.log") -Tail 60 -ErrorAction SilentlyContinue
      - uses: actions/upload-artifact@v4
        with:
          name: instalador-windows
          path: salida/*.msi
          retention-days: 30
      - name: Publicar en la release
        if: inputs.publicar
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v$VERSION"
          gh release view "$tag" > /dev/null 2>&1 || gh release create "$tag" --prerelease --target "$GITHUB_SHA" --title "SocialHub $VERSION" \
            --notes "Instaladores sin firmar. Windows avisa con «Windows protegió tu PC»: pulsa «Más información» y «Ejecutar de todas formas»."
          gh release upload "$tag" salida/*.msi --clobber

  macos:
    name: Instalador de macOS (.dmg)
    # macOS gasta x10 minutos: solo a mano con «windows-y-macos» o en una PR que cambia este workflow
    if: github.event_name == 'pull_request' || inputs.sistemas == 'windows-y-macos'
    needs: windows
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Compilar la web
        working-directory: frontend
        run: |
          npm ci
          npm run build
      - name: Empaquetar SocialHub con la web
        working-directory: backend
        run: mvn -B -DskipTests package
      # PostgreSQL y FFmpeg salen del sistema en el que se compila (perfiles del pom): aquí, Apple Silicon
      - name: Comprobar que el jar lleva PostgreSQL y FFmpeg de macOS
        run: |
          libs=$(unzip -Z1 backend/target/socialhub.jar | grep '^BOOT-INF/lib/' || true)
          echo "$libs" | grep -E 'postgres|ffmpeg|javacpp'
          arch=$(uname -m)
          if [ "$arch" = "arm64" ]; then pg=darwin-arm64v8; ff=macosx-arm64; else pg=darwin-amd64; ff=macosx-x86_64; fi
          echo "$libs" | grep -q "embedded-postgres-binaries-$pg" || { echo "::error::El jar no lleva PostgreSQL de macOS ($pg)"; exit 1; }
          echo "$libs" | grep -q "ffmpeg-.*-$ff-gpl.jar" || { echo "::error::El jar no lleva FFmpeg de macOS ($ff)"; exit 1; }
          echo "$libs" | grep -q "javacpp-.*-$ff.jar" || { echo "::error::El jar no lleva javacpp de macOS ($ff)"; exit 1; }
          if echo "$libs" | grep -E 'binaries-(linux|windows)|-(linux|windows)-'; then echo "::error::El jar lleva binarios de otro sistema"; exit 1; fi
          echo "El jar lleva PostgreSQL y FFmpeg de macOS ($arch)"
      - name: Crear el .dmg
        run: |
          mkdir -p entrada salida
          cp backend/target/socialhub.jar entrada/
          jpackage --type dmg --name SocialHub --app-version "$VERSION" \
            --vendor "$FABRICANTE" --description "$DESCRIPCION" \
            --input entrada --main-jar socialhub.jar --dest salida \
            --java-options "-Dsocialhub.desktop=true" \
            --mac-package-identifier com.socialhub.app --verbose
          ls -la salida
      # Prueba real: se monta el .dmg, se copia la app (como al arrastrarla a Aplicaciones), se abre y se cierra desde la web
      - name: Montar y probar el .dmg
        run: |
          dmg=$(ls salida/*.dmg | head -1)
          hdiutil attach "$dmg" -nobrowse -readonly -mountpoint "$RUNNER_TEMP/dmg"
          ls -la "$RUNNER_TEMP/dmg"
          mkdir -p "$RUNNER_TEMP/apps"
          cp -R "$RUNNER_TEMP/dmg/SocialHub.app" "$RUNNER_TEMP/apps/"
          hdiutil detach "$RUNNER_TEMP/dmg"
          exe="$RUNNER_TEMP/apps/SocialHub.app/Contents/MacOS/SocialHub"
          [ -x "$exe" ] || { ls -R "$RUNNER_TEMP/apps/SocialHub.app/Contents" | head -40; echo "::error::No está $exe"; exit 1; }
          logs="$HOME/Library/Application Support/SocialHub/logs/socialhub.log"
          mostrar_registro() { [ -f "$logs" ] && tail -80 "$logs" || echo "(no hay registro en $logs)"; }
          esperar() {
            for i in $(seq 1 90); do
              if curl -fsS --noproxy '*' -m 3 http://127.0.0.1:8686/api/app-mode > "$RUNNER_TEMP/modo.json" 2>/dev/null; then return 0; fi
              sleep 2
            done
            return 1
          }
          "$exe" > "$RUNNER_TEMP/salida.log" 2>&1 &
          app=$!
          if ! esperar; then mostrar_registro; cat "$RUNNER_TEMP/salida.log"; echo "::error::SocialHub instalado no respondió en 127.0.0.1:8686"; exit 1; fi
          echo "Responde: $(cat "$RUNNER_TEMP/modo.json")"
          curl -fsS --noproxy '*' http://127.0.0.1:8686/ | grep -q '<div id="root">' || { echo "::error::La web no se sirve"; exit 1; }
          [ -f "$logs" ] || { echo "::error::No hay registro en $logs"; exit 1; }
          # PostgreSQL arrancó: hay proceso suyo, su carpeta de datos tiene postmaster.pid y el registro no habla de fallos
          pgrep -f "SocialHub/runtime/.*/bin/postgres" > /dev/null || { ps aux | grep -i postgres | head; mostrar_registro; echo "::error::No hay proceso de PostgreSQL"; exit 1; }
          [ -f "$HOME/Library/Application Support/SocialHub/pgdata/postmaster.pid" ] || { echo "::error::No existe postmaster.pid"; exit 1; }
          grep -qi "database system is ready to accept connections\|PostgreSQL" "$logs" || { mostrar_registro; echo "::error::El registro no menciona PostgreSQL"; exit 1; }
          echo "PostgreSQL en marcha"
          # FFmpeg incluido: se extrae y se ejecuta
          ff=$(find "$HOME/Library/Application Support/SocialHub/runtime" -name ffmpeg -type f 2>/dev/null | head -1)
          if [ -n "$ff" ]; then "$ff" -version | head -1; else echo "FFmpeg aún no extraído (se extrae al usarlo)"; fi
          # Segundo arranque: solo abre el navegador y termina
          "$exe" > "$RUNNER_TEMP/segundo.log" 2>&1 &
          segundo=$!
          for i in $(seq 1 30); do kill -0 "$segundo" 2>/dev/null || break; sleep 2; done
          if kill -0 "$segundo" 2>/dev/null; then kill "$segundo"; echo "--- segundo.log"; cat "$RUNNER_TEMP/segundo.log"; ps aux | grep -i "[S]ocialHub" | head; echo "::error::El segundo arranque no terminó en 60 s: arrancaría dos veces"; exit 1; fi
          echo "--- segundo.log"; cat "$RUNNER_TEMP/segundo.log"
          echo "Segundo arranque terminó enseguida, como debe"
          curl -fsS --noproxy '*' -X POST -H 'X-SocialHub-Request: 1' http://127.0.0.1:8686/api/app/shutdown > /dev/null
          for i in $(seq 1 30); do kill -0 "$app" 2>/dev/null || break; sleep 2; done
          if kill -0 "$app" 2>/dev/null; then mostrar_registro; echo "::error::SocialHub no se cerró desde la web"; exit 1; fi
          if pgrep -f "SocialHub/runtime/.*/bin/postgres" > /dev/null; then echo "::error::PostgreSQL sigue en marcha después de cerrar"; exit 1; fi
          echo "Se cierra desde la web y para PostgreSQL"
      - name: Registro de SocialHub
        if: always()
        run: tail -80 "$HOME/Library/Application Support/SocialHub/logs/socialhub.log" 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        with:
          name: instalador-macos
          path: salida/*.dmg
          retention-days: 30
      - name: Publicar en la release
        if: inputs.publicar
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "v$VERSION" salida/*.dmg --clobber
