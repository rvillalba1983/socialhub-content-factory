name: Instaladores

# A mano: genera el instalador de Windows (.msi) y, si se pide, el de macOS (.dmg), con Java y PostgreSQL dentro.
# El .msi se instala y se prueba en la propia máquina de GitHub antes de darlo por bueno.
#
# Versiones (la fuente de verdad es <revision> en backend/pom.xml, por ejemplo 1.2.0):
#  - Release (publicar): la versión que se escribe, o la del pom si se deja vacía. Por ejemplo 1.2.0.
#  - Cualquier otra compilación (a mano sin publicar, o PR): <mayor>.<menor>.<número de ejecución>, por ejemplo 1.2.57.
#    Así sube en cada ejecución y Windows lo trata como una actualización de verdad (con la misma versión
#    entraría en «modo mantenimiento» y no cambiaría nada). El jar lleva esa misma versión, y la web la enseña.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Solo si publicas una release: versión exacta de tres números (vacío: la del pom). Sin publicar se ignora y sale 1.2.<ejecución>"
        required: false
        default: ""
      sistemas:
        description: "Instaladores (macOS gasta x10 minutos)"
        type: choice
        default: windows
        options: [windows, windows-y-macos]
      publicar:
        description: "Publicar en una release de GitHub (privada, como el repositorio)"
        type: boolean
        default: false
  # Al cambiar este workflow en una PR, se prueban el .msi y el .dmg (sin publicar nada)
  pull_request:
    paths: [".github/workflows/instaladores.yml"]

permissions:
  contents: write

env:
  # Identifica el programa entre versiones: el instalador nuevo sustituye al anterior. No cambiar.
  UPGRADE_UUID: cb398502-9514-4d01-b4d8-be1d607e5d9f
  # Sin tildes: WiX usa la página de códigos 1252 del instalador en inglés y rechaza otros caracteres
  DESCRIPCION: "Fabrica de contenido de El DeLito y Litoques"
  FABRICANTE: "Raul Villalba"

jobs:
  version:
    name: Versión de esta compilación
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.calcular.outputs.version }}
      commit: ${{ steps.calcular.outputs.commit }}
    steps:
      - uses: actions/checkout@v4
      - name: Calcular la versión
        id: calcular
        env:
          ENTRADA: ${{ inputs.version }}
          PUBLICAR: ${{ inputs.publicar }}
          CABEZA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          base=$(sed -n 's:.*<revision>\(.*\)</revision>.*:\1:p' backend/pom.xml | head -1)
          [[ "$base" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::No encuentro <revision> de tres números en backend/pom.xml (sale «$base»)"; exit 1; }
          if [ "$PUBLICAR" = "true" ]; then
            version="${ENTRADA:-$base}"
          else
            version="${base%.*}.${GITHUB_RUN_NUMBER}"
          fi
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::La versión tiene que ser de tres números, como 1.2.0 (sale «$version»)"; exit 1; }
          [ "${version##*.}" -le 65535 ] || { echo "::error::El MSI no admite un último número mayor de 65535 ($version)"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "commit=${CABEZA::7}" >> "$GITHUB_OUTPUT"
          echo "### SocialHub $version (commit ${CABEZA::7})" >> "$GITHUB_STEP_SUMMARY"

  windows:
    name: Instalador de Windows (.msi)
    needs: version
    runs-on: windows-latest
    timeout-minutes: 40
    env:
      VERSION: ${{ needs.version.outputs.version }}
      COMMIT: ${{ needs.version.outputs.commit }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Compilar la web
        working-directory: frontend
        run: |
          npm ci
          npm run build
      - name: Empaquetar SocialHub con la web
        working-directory: backend
        shell: bash
        run: mvn -B -DskipTests -Drevision="$VERSION" -Dsocialhub.commit="$COMMIT" package
      # jpackage necesita WiX (gratuito) para crear el .msi
      - name: WiX 3.14
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\WiX Toolset v3.14\bin\candle.exe")) { choco install wixtoolset --version 3.14.1 --no-progress -y }
          & "${env:ProgramFiles(x86)}\WiX Toolset v3.14\bin\candle.exe" -? | Select-Object -First 1
      - name: Crear el .msi
        shell: bash
        run: |
          export PATH="$PATH:/c/Program Files (x86)/WiX Toolset v3.14/bin"
          mkdir -p entrada salida
          cp backend/target/socialhub.jar entrada/
          jpackage --type msi --name SocialHub --app-version "$VERSION" \
            --vendor "$FABRICANTE" --description "$DESCRIPCION" \
            --input entrada --main-jar socialhub.jar --dest salida \
            --java-options "-Dsocialhub.desktop=true" \
            --java-options '-Dsocialhub.jvm.logs=$LOCALAPPDATA\SocialHub\logs' \
            --java-options '-XX:ErrorFile=$LOCALAPPDATA\SocialHub\logs\hs_err_pid%p.log' \
            --win-menu --win-menu-group SocialHub --win-shortcut \
            --win-upgrade-uuid "$UPGRADE_UUID" --verbose
          ls -la salida
      # Junto al .msi, los lanzadores que instalan y desinstalan dejando un registro (un .msi no lo deja solo)
      - name: Lanzadores con registro
        shell: bash
        run: |
          # Registros de msiexec (/l*v) de todas las pruebas; se suben como artefacto aunque algo falle
          echo "REGISTROS=$RUNNER_TEMP\\registros" >> "$GITHUB_ENV"
          REGISTROS="$RUNNER_TEMP\\registros"
          copiar() { sed -e 's/\r$//' -e 's/$/\r/' "$1" > "salida/$2"; }
          copiar scripts/windows/instalador/instalar-con-registro.cmd "Instalar SocialHub (con registro).cmd"
          copiar scripts/windows/instalador/desinstalar-con-registro.cmd "Desinstalar SocialHub (con registro).cmd"
          mkdir -p "$(cygpath -u "$REGISTROS")"
          ls -la salida
      # El .msi nuevo se instala encima de la versión ya publicada (mismo UPGRADE_UUID) sin desinstalar antes
      - name: Actualizar encima de una versión anterior
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $nuevo = Get-ChildItem salida\*.msi | Select-Object -First 1
          $tag = gh release list --limit 20 --json tagName --jq '.[].tagName' | Where-Object { $_ -ne "v$env:VERSION" } | Select-Object -First 1
          if (-not $tag) { Write-Host "No hay ninguna release anterior: se omite la prueba"; exit 0 }
          New-Item -ItemType Directory -Force anterior | Out-Null
          gh release download $tag --pattern "*.msi" --dir anterior
          $viejo = Get-ChildItem anterior\*.msi | Select-Object -First 1
          if (-not $viejo) { Write-Host "La release $tag no tiene .msi: se omite la prueba"; exit 0 }
          function Instalados { Get-ItemProperty "HKLM:\Software\Microsoft\Windows\CurrentVersion\Uninstall\*" | Where-Object { $_.DisplayName -eq "SocialHub" } }
          $p = Start-Process msiexec.exe -ArgumentList "/i `"$($viejo.FullName)`" /qn /l*v `"$env:REGISTROS\instalar-anterior.log`"" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "No se instaló $($viejo.Name): $($p.ExitCode)" }
          $antes = (Instalados).DisplayVersion
          Write-Host "Instalado: $antes"
          # Con la misma versión (o menor) Windows entra en «modo mantenimiento» y no actualiza nada: aquí tiene que subir
          if ([version]$antes -ge [version]$env:VERSION) { throw "La versión nueva ($env:VERSION) no es mayor que la instalada ($antes): Windows no actualizaría" }
          $p = Start-Process msiexec.exe -ArgumentList "/i `"$($nuevo.FullName)`" /qn /l*v `"$env:REGISTROS\actualizar.log`"" -Wait -PassThru
          if ($p.ExitCode -ne 0) { Get-Content "$env:REGISTROS\actualizar.log" -Tail 40; throw "No se actualizó encima de $($viejo.Name): $($p.ExitCode)" }
          $ins = @(Instalados)
          if ($ins.Count -ne 1 -or $ins[0].DisplayVersion -ne $env:VERSION) { $ins | Format-List DisplayName, DisplayVersion; throw "Tras actualizar tiene que quedar solo SocialHub $env:VERSION" }
          Write-Host "Actualizado encima de $($viejo.Name): de $antes a $env:VERSION"
          # Después de actualizar, la web tiene que devolver la versión nueva (y no la anterior)
          $exe = Join-Path $env:ProgramFiles "SocialHub\SocialHub.exe"
          $app = Start-Process $exe -PassThru
          $v = $null
          for ($i = 0; $i -lt 90; $i++) {
            try { $v = Invoke-RestMethod http://localhost:8686/api/system/version -TimeoutSec 3; break } catch {}
            Start-Sleep 2
          }
          if (-not $v) { Get-Content (Join-Path $env:LOCALAPPDATA "SocialHub\logs\socialhub.log") -Tail 60 -ErrorAction SilentlyContinue; throw "SocialHub actualizado no respondió en localhost:8686" }
          Write-Host "La web devuelve: versión $($v.version), commit $($v.commit), compilada $($v.build_time)"
          if ($v.version -ne $env:VERSION) { throw "Tras actualizar, la web dice $($v.version) y tendría que decir $env:VERSION" }
          if ($v.commit -ne $env:COMMIT) { throw "Tras actualizar, el commit es $($v.commit) y tendría que ser $env:COMMIT" }
          Invoke-WebRequest http://localhost:8686/api/app/shutdown -Method Post -Headers @{ 'X-SocialHub-Request' = '1' } -UseBasicParsing | Out-Null
          if (-not $app.WaitForExit(60000)) { throw "SocialHub no se cerró tras actualizar" }
          $u = Start-Process msiexec.exe -ArgumentList "/x `"$($nuevo.FullName)`" /qn /l*v `"$env:REGISTROS\desinstalar-tras-actualizar.log`"" -Wait -PassThru
          if ($u.ExitCode -ne 0) { throw "No se desinstaló tras actualizar: $($u.ExitCode)" }
      # Prueba real: se instala (en Archivos de programa), se abre, responde, no arranca dos veces y se cierra desde la web
      - name: Instalar y probar el .msi
        shell: pwsh
        run: |
          $msi = Get-ChildItem salida\*.msi | Select-Object -First 1
          $p = Start-Process msiexec.exe -ArgumentList "/i `"$($msi.FullName)`" /qn /l*v `"$env:REGISTROS\instalar.log`"" -Wait -PassThru
          if ($p.ExitCode -ne 0) { Get-Content "$env:REGISTROS\instalar.log" -Tail 40; throw "msiexec terminó con $($p.ExitCode)" }
          $exe = Join-Path $env:ProgramFiles "SocialHub\SocialHub.exe"
          if (-not (Test-Path $exe)) { Get-ChildItem $env:ProgramFiles | Select-Object -First 40; throw "No está $exe" }
          # Dos clics seguidos: solo arranca uno; el otro espera y termina
          $app = Start-Process $exe -PassThru
          Start-Sleep 2
          $twin = Start-Process $exe -PassThru
          $ok = $false
          for ($i = 0; $i -lt 90; $i++) {
            try { $r = Invoke-WebRequest http://localhost:8686/api/app-mode -UseBasicParsing -TimeoutSec 3; if ($r.StatusCode -eq 200) { $ok = $true; break } } catch {}
            Start-Sleep 2
          }
          $logs = Join-Path $env:LOCALAPPDATA "SocialHub\logs\socialhub.log"
          if (-not $ok) { if (Test-Path $logs) { Get-Content $logs -Tail 60 }; throw "SocialHub instalado no respondió en localhost:8686" }
          Write-Host "Responde: $($r.Content)"
          # Registro de arranque (arranque.log): fases del arranque y opciones de la JVM con la carpeta de registros YA expandida
          $dirLogs = Join-Path $env:LOCALAPPDATA "SocialHub\logs"
          $arranque = Join-Path $dirLogs "arranque.log"
          $txt = ""
          for ($i = 0; $i -lt 30; $i++) {
            if (Test-Path $arranque) { $txt = Get-Content $arranque -Raw; if ($txt -match 'SocialHub listo') { break } }
            Start-Sleep 1
          }
          Write-Host "---- arranque.log"; Write-Host $txt
          if (-not $txt) { throw "No se creó $arranque" }
          foreach ($fase in 'Arranque de SocialHub', 'PostgreSQL: en marcha', 'Flyway: base de datos socialhub al día', 'Servidor web en el puerto 8686', 'SocialHub listo') {
            if ($txt -notmatch [regex]::Escape($fase)) { throw "arranque.log no tiene la fase «$fase»" }
          }
          if ($txt -match 'no expandió') { throw "El lanzador de jpackage no expandió `$LOCALAPPDATA en las opciones de la JVM" }
          if ($txt -notmatch [regex]::Escape("Registros de la JVM en: $dirLogs")) { throw "La opción socialhub.jvm.logs no apunta a $dirLogs" }
          if ($txt -notmatch [regex]::Escape("-XX:ErrorFile=$dirLogs\hs_err_pid%p.log")) { throw "-XX:ErrorFile no apunta a $dirLogs" }
          $v = Invoke-RestMethod http://localhost:8686/api/system/version
          Write-Host "Versión: $($v.version), commit $($v.commit), compilada $($v.build_time)"
          if ($v.version -ne $env:VERSION -or $v.commit -ne $env:COMMIT) { throw "La web dice $($v.version) · $($v.commit) y tendría que decir $env:VERSION · $env:COMMIT" }
          if (-not $twin.WaitForExit(60000)) { throw "El segundo clic no terminó: arrancarían dos SocialHub" }
          # PostgreSQL lleva al lado las bibliotecas de Visual C++ de Java (hay equipos sin ellas instaladas)
          $pgbin = Join-Path $env:LOCALAPPDATA "SocialHub\runtime\postgres-windows-x86_64\bin"
          foreach ($dll in 'vcruntime140.dll', 'vcruntime140_1.dll', 'msvcp140.dll') {
            if (-not (Test-Path (Join-Path $pgbin $dll))) { throw "Falta $dll junto a PostgreSQL" }
          }
          Write-Host "Bibliotecas de Visual C++ junto a PostgreSQL"
          if (-not (Test-Path $logs)) { throw "No hay registro en $logs" }
          $web = Invoke-WebRequest http://localhost:8686/ -UseBasicParsing
          if ($web.Content -notmatch '<div id="root">') { throw "La web no se sirve" }
          # Segundo arranque: solo abre el navegador y termina
          $second = Start-Process $exe -PassThru
          if (-not $second.WaitForExit(30000)) { throw "El segundo arranque no terminó: arrancaría dos veces" }
          Write-Host "Segundo arranque terminó enseguida, como debe"
          Invoke-WebRequest http://localhost:8686/api/app/shutdown -Method Post -Headers @{ 'X-SocialHub-Request' = '1' } -UseBasicParsing | Out-Null
          if (-not $app.WaitForExit(60000)) { throw "SocialHub no se cerró desde la web" }
          if (Get-Process postgres -ErrorAction SilentlyContinue) { throw "PostgreSQL sigue en marcha después de cerrar" }
          Write-Host "Se cierra desde la web y para PostgreSQL"
          # PostgreSQL descomprimido a medias (le falta un archivo): al abrir se descomprime de nuevo y arranca
          Remove-Item (Join-Path $pgbin "zlib1.dll")
          $again = Start-Process $exe -PassThru
          $ok = $false
          for ($i = 0; $i -lt 90; $i++) {
            try { $r = Invoke-WebRequest http://localhost:8686/api/app-mode -UseBasicParsing -TimeoutSec 3; if ($r.StatusCode -eq 200) { $ok = $true; break } } catch {}
            Start-Sleep 2
          }
          if (-not $ok) { Get-Content $logs -Tail 60; throw "Con PostgreSQL a medias no se recuperó" }
          if (-not (Test-Path (Join-Path $pgbin "zlib1.dll"))) { throw "No se volvió a descomprimir PostgreSQL" }
          Invoke-WebRequest http://localhost:8686/api/app/shutdown -Method Post -Headers @{ 'X-SocialHub-Request' = '1' } -UseBasicParsing | Out-Null
          if (-not $again.WaitForExit(60000)) { throw "SocialHub no se cerró la segunda vez" }
          Write-Host "Con PostgreSQL a medias, lo descomprime de nuevo y arranca"
          # Desinstalar no borra los datos
          $u = Start-Process msiexec.exe -ArgumentList "/x `"$($msi.FullName)`" /qn /l*v `"$env:REGISTROS\desinstalar.log`"" -Wait -PassThru
          if ($u.ExitCode -ne 0) { throw "La desinstalación terminó con $($u.ExitCode)" }
          if (-not (Test-Path (Join-Path $env:LOCALAPPDATA "SocialHub\pgdata"))) { throw "Al desinstalar se borraron los datos" }
          Write-Host "Desinstalado; los datos siguen en $env:LOCALAPPDATA\SocialHub"
      # Los lanzadores que se publican junto al .msi: instalan y desinstalan dejando su registro en %LOCALAPPDATA%\SocialHub\logs
      - name: Probar los lanzadores con registro
        shell: pwsh
        run: |
          $dirLogs = Join-Path $env:LOCALAPPDATA "SocialHub\logs"
          # La carpeta de registros se aparta (para subirla) y se borra: el lanzador tiene que crearla solo
          if (Test-Path $dirLogs) { Copy-Item $dirLogs "$env:REGISTROS\app-logs-antes" -Recurse; Remove-Item $dirLogs -Recurse -Force }
          $ins = Get-Item "salida\Instalar SocialHub (con registro).cmd"
          $des = Get-Item "salida\Desinstalar SocialHub (con registro).cmd"
          foreach ($f in $ins, $des) {
            $bytes = [IO.File]::ReadAllBytes($f.FullName)
            if (($bytes | Where-Object { $_ -gt 127 }).Count -gt 0) { throw "$($f.Name) lleva caracteres que no son ASCII" }
            if ([Text.Encoding]::ASCII.GetString($bytes) -notmatch "\r\n") { throw "$($f.Name) no tiene saltos de línea de Windows (CRLF)" }
          }
          $p = Start-Process -FilePath $ins.FullName -ArgumentList '/silencioso' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "El lanzador de instalación terminó con $($p.ExitCode)" }
          $logIns = @(Get-ChildItem $dirLogs -Filter 'instalacion-*.log')
          if ($logIns.Count -ne 1 -or $logIns[0].Length -lt 1000) { Get-ChildItem $dirLogs; throw "No hay un registro de instalación con contenido en $dirLogs" }
          if ((Get-Content $logIns[0].FullName -Raw) -notmatch 'Installation (completed|operation completed) successfully') { throw "El registro de instalación no dice que terminara bien" }
          if (-not (Test-Path (Join-Path $env:ProgramFiles "SocialHub\SocialHub.exe"))) { throw "El lanzador no dejó SocialHub instalado" }
          Write-Host "Instalado con registro: $($logIns[0].Name) ($($logIns[0].Length) bytes)"
          $p = Start-Process -FilePath $des.FullName -ArgumentList '/silencioso' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "El lanzador de desinstalación terminó con $($p.ExitCode)" }
          $logDes = @(Get-ChildItem $dirLogs -Filter 'desinstalacion-*.log')
          if ($logDes.Count -ne 1 -or $logDes[0].Length -lt 1000) { Get-ChildItem $dirLogs; throw "No hay un registro de desinstalación con contenido" }
          if (Test-Path (Join-Path $env:ProgramFiles "SocialHub\SocialHub.exe")) { throw "El lanzador no desinstaló SocialHub" }
          # Sin nada instalado, el lanzador lo dice y termina bien
          $p = Start-Process -FilePath $des.FullName -ArgumentList '/silencioso' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Desinstalar sin nada instalado terminó con $($p.ExitCode)" }
          Write-Host "Desinstalado con registro: $($logDes[0].Name) ($($logDes[0].Length) bytes)"
      - name: Reunir los registros de la instalación
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force $env:REGISTROS | Out-Null
          $dirLogs = Join-Path $env:LOCALAPPDATA "SocialHub\logs"
          if (Test-Path $dirLogs) { Copy-Item $dirLogs "$env:REGISTROS\app-logs" -Recurse -ErrorAction SilentlyContinue }
          Get-WinEvent -FilterHashtable @{ LogName = 'Application'; ProviderName = 'MsiInstaller' } -MaxEvents 40 -ErrorAction SilentlyContinue |
            Format-List TimeCreated, Id, LevelDisplayName, Message | Out-File "$env:REGISTROS\eventos-msiinstaller.txt" -Encoding utf8
          Get-ChildItem $env:REGISTROS -Recurse | Select-Object FullName, Length
      - name: Registro de SocialHub
        if: always()
        shell: pwsh
        run: Get-Content (Join-Path $env:LOCALAPPDATA "SocialHub\logs\socialhub.log") -Tail 60 -ErrorAction SilentlyContinue
      - name: Subir los registros de la instalación
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: registros-instalacion-windows
          path: ${{ runner.temp }}\registros
          if-no-files-found: warn
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: instalador-windows
          path: |
            salida/*.msi
            salida/*.cmd
          retention-days: 30
      - name: Publicar en la release
        if: inputs.publicar
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v$VERSION"
          gh release view "$tag" > /dev/null 2>&1 || gh release create "$tag" --prerelease --target "$GITHUB_SHA" --title "SocialHub $VERSION" \
            --notes "Instaladores sin firmar. Windows avisa con «Windows protegió tu PC»: pulsa «Más información» y «Ejecutar de todas formas»."
          gh release upload "$tag" salida/*.msi salida/*.cmd --clobber

  macos:
    name: Instalador de macOS (.dmg)
    # macOS gasta x10 minutos: solo a mano con «windows-y-macos» o en una PR que cambia este workflow
    if: github.event_name == 'pull_request' || inputs.sistemas == 'windows-y-macos'
    needs: [version, windows]
    runs-on: macos-latest
    timeout-minutes: 40
    env:
      VERSION: ${{ needs.version.outputs.version }}
      COMMIT: ${{ needs.version.outputs.commit }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Compilar la web
        working-directory: frontend
        run: |
          npm ci
          npm run build
      - name: Empaquetar SocialHub con la web
        working-directory: backend
        run: mvn -B -DskipTests -Drevision="$VERSION" -Dsocialhub.commit="$COMMIT" package
      # PostgreSQL y FFmpeg salen del sistema en el que se compila (perfiles del pom): aquí, Apple Silicon
      - name: Comprobar que el jar lleva PostgreSQL y FFmpeg de macOS
        run: |
          libs=$(unzip -Z1 backend/target/socialhub.jar | grep '^BOOT-INF/lib/' || true)
          echo "$libs" | grep -E 'postgres|ffmpeg|javacpp'
          arch=$(uname -m)
          if [ "$arch" = "arm64" ]; then pg=darwin-arm64v8; ff=macosx-arm64; else pg=darwin-amd64; ff=macosx-x86_64; fi
          echo "$libs" | grep -q "embedded-postgres-binaries-$pg" || { echo "::error::El jar no lleva PostgreSQL de macOS ($pg)"; exit 1; }
          echo "$libs" | grep -q "ffmpeg-.*-$ff-gpl.jar" || { echo "::error::El jar no lleva FFmpeg de macOS ($ff)"; exit 1; }
          echo "$libs" | grep -q "javacpp-.*-$ff.jar" || { echo "::error::El jar no lleva javacpp de macOS ($ff)"; exit 1; }
          if echo "$libs" | grep -E 'binaries-(linux|windows)|-(linux|windows)-'; then echo "::error::El jar lleva binarios de otro sistema"; exit 1; fi
          echo "El jar lleva PostgreSQL y FFmpeg de macOS ($arch)"
      - name: Crear el .dmg
        run: |
          # Sin -XX:ErrorFile: la ruta de macOS lleva un espacio («Application Support») y el lanzador parte las opciones ahí.
          # El informe de fallo fatal queda en la carpeta temporal y SocialHub lo recoge al abrir (JvmCrashReports).
          mkdir -p entrada salida
          cp backend/target/socialhub.jar entrada/
          jpackage --type dmg --name SocialHub --app-version "$VERSION" \
            --vendor "$FABRICANTE" --description "$DESCRIPCION" \
            --input entrada --main-jar socialhub.jar --dest salida \
            --java-options "-Dsocialhub.desktop=true" \
            --mac-package-identifier com.socialhub.app --verbose
          ls -la salida
      # Prueba real: se monta el .dmg, se copia la app (como al arrastrarla a Aplicaciones), se abre y se cierra desde la web
      - name: Montar y probar el .dmg
        run: |
          dmg=$(ls salida/*.dmg | head -1)
          hdiutil attach "$dmg" -nobrowse -readonly -mountpoint "$RUNNER_TEMP/dmg"
          ls -la "$RUNNER_TEMP/dmg"
          mkdir -p "$RUNNER_TEMP/apps"
          cp -R "$RUNNER_TEMP/dmg/SocialHub.app" "$RUNNER_TEMP/apps/"
          hdiutil detach "$RUNNER_TEMP/dmg"
          exe="$RUNNER_TEMP/apps/SocialHub.app/Contents/MacOS/SocialHub"
          [ -x "$exe" ] || { ls -R "$RUNNER_TEMP/apps/SocialHub.app/Contents" | head -40; echo "::error::No está $exe"; exit 1; }
          logs="$HOME/Library/Application Support/SocialHub/logs/socialhub.log"
          mostrar_registro() { [ -f "$logs" ] && tail -80 "$logs" || echo "(no hay registro en $logs)"; }
          esperar() {
            for i in $(seq 1 90); do
              if curl -fsS --noproxy '*' -m 3 http://127.0.0.1:8686/api/app-mode > "$RUNNER_TEMP/modo.json" 2>/dev/null; then return 0; fi
              sleep 2
            done
            return 1
          }
          "$exe" > "$RUNNER_TEMP/salida.log" 2>&1 &
          app=$!
          if ! esperar; then mostrar_registro; cat "$RUNNER_TEMP/salida.log"; echo "::error::SocialHub instalado no respondió en 127.0.0.1:8686"; exit 1; fi
          echo "Responde: $(cat "$RUNNER_TEMP/modo.json")"
          curl -fsS --noproxy '*' http://127.0.0.1:8686/api/system/version > "$RUNNER_TEMP/version.json"
          echo "Versión: $(cat "$RUNNER_TEMP/version.json")"
          python3 -c "import sys,json; d=json.load(open('$RUNNER_TEMP/version.json')); sys.exit(0 if d['version']=='$VERSION' and d['commit']=='$COMMIT' else 1)" || { echo "::error::La web no dice $VERSION · $COMMIT"; exit 1; }
          curl -fsS -m 30 --noproxy '*' http://127.0.0.1:8686/ > "$RUNNER_TEMP/raiz.html" || { mostrar_registro; cat "$HOME/Library/Application Support/SocialHub/logs/arranque.log"; echo "::error::La web no responde en /"; exit 1; }
          grep -q '<div id="root">' "$RUNNER_TEMP/raiz.html" || { echo "::error::La web no se sirve"; exit 1; }
          [ -f "$logs" ] || { echo "::error::No hay registro en $logs"; exit 1; }
          arranque="$HOME/Library/Application Support/SocialHub/logs/arranque.log"
          [ -f "$arranque" ] || { echo "::error::No hay registro de arranque en $arranque"; exit 1; }
          cat "$arranque"
          for fase in "Arranque de SocialHub" "PostgreSQL: en marcha" "SocialHub listo"; do grep -qF "$fase" "$arranque" || { echo "::error::arranque.log no tiene «$fase»"; exit 1; }; done
          # PostgreSQL arrancó: hay proceso suyo, su carpeta de datos tiene postmaster.pid y el registro no habla de fallos
          pgrep -f "SocialHub/runtime/.*/bin/postgres" > /dev/null || { ps aux | grep -i postgres | head; mostrar_registro; echo "::error::No hay proceso de PostgreSQL"; exit 1; }
          [ -f "$HOME/Library/Application Support/SocialHub/pgdata/postmaster.pid" ] || { echo "::error::No existe postmaster.pid"; exit 1; }
          grep -qi "database system is ready to accept connections\|PostgreSQL" "$logs" || { mostrar_registro; echo "::error::El registro no menciona PostgreSQL"; exit 1; }
          echo "PostgreSQL en marcha"
          # FFmpeg incluido (OBLIGATORIO): se relanza por la API la comprobación de herramientas locales y se exige «OK · FFmpeg»
          api=http://127.0.0.1:8686/api
          cab=(-H 'X-SocialHub-Request: 1' -H 'Content-Type: application/json')
          curl -fsS --noproxy '*' "${cab[@]}" -X PUT -d '{"mode":"REAL"}' "$api/app-mode" > /dev/null || { echo "::error::No se pudo pasar a modo real"; exit 1; }
          tarea() { curl -fsS --noproxy '*' "$api/tasks/check-local-tools"; }
          estado() { python3 -c 'import sys,json; print(json.load(sys.stdin)["status"])'; }
          terminada() { case "$1" in [Cc][Oo][Mm][Pp][Ll][Ee][Tt][Ee][Dd]|[Ff][Aa][Ii][Ll][Ee][Dd]) return 0;; esac; return 1; }
          # Espera a que la comprobación del arranque termine (o a que exista)
          st=ninguna
          for i in $(seq 1 60); do
            st=$(tarea 2>/dev/null | estado 2>/dev/null || echo ninguna)
            terminada "$st" && break
            sleep 2
          done
          echo "Comprobación del arranque: $st"; tarea | python3 -m json.tool | head -60
          # Se relanza (RERUN si está completada, RETRY si falló) para comprobar el estado actual
          cmd=RERUN; case "$st" in [Ff][Aa][Ii][Ll][Ee][Dd]) cmd=RETRY;; esac
          curl -fsS --noproxy '*' "${cab[@]}" -X POST -d "{\"type\":\"$cmd\"}" "$api/tasks/check-local-tools/commands" > /dev/null || { echo "::error::No se pudo lanzar $cmd"; exit 1; }
          sleep 3
          for i in $(seq 1 60); do
            st=$(tarea | estado)
            terminada "$st" && break
            sleep 2
          done
          tarea > "$RUNNER_TEMP/tarea.json"; python3 -m json.tool "$RUNNER_TEMP/tarea.json" | head -80
          grep -q 'OK · FFmpeg' "$RUNNER_TEMP/tarea.json" || { mostrar_registro; echo "::error::La comprobación de herramientas no dice «OK · FFmpeg»"; exit 1; }
          echo "Comprobación de herramientas: OK · FFmpeg"
          # Pieza real con el FFmpeg que SocialHub dejó listo: vídeo de 2 s desde una imagen y un audio
          ff=$(find "$HOME/Library/Application Support/SocialHub/runtime" -name ffmpeg -type f 2>/dev/null | head -1)
          fp="$(dirname "$ff")/ffprobe"
          ls -la "$(dirname "$ff")" | head; [ -x "$ff" ] || { echo "::error::FFmpeg extraído sin permiso de ejecución: $ff"; exit 1; }
          pieza="$RUNNER_TEMP/pieza"; mkdir -p "$pieza"
          "$ff" -y -loglevel error -f lavfi -i color=c=orange:s=540x960 -frames:v 1 "$pieza/imagen.png"
          "$ff" -y -loglevel error -f lavfi -i "sine=frequency=440:duration=2" "$pieza/audio.m4a"
          "$ff" -y -loglevel error -loop 1 -i "$pieza/imagen.png" -i "$pieza/audio.m4a" -t 2 -c:v libx264 -pix_fmt yuv420p -c:a aac -shortest -movflags +faststart "$pieza/pieza.mp4"
          [ -s "$pieza/pieza.mp4" ] || { echo "::error::No se generó la pieza"; exit 1; }
          dur=$("$fp" -v error -show_entries format=duration -of csv=p=0 "$pieza/pieza.mp4")
          echo "Pieza generada: $(stat -f %z "$pieza/pieza.mp4") bytes, ${dur}s"
          python3 -c "import sys; sys.exit(0 if float('$dur')>1 else 1)" || { echo "::error::La pieza dura menos de 1 s ($dur)"; exit 1; }
          echo "FFmpeg probado en macOS: OK"
          # Segundo arranque: solo abre el navegador y termina
          "$exe" > "$RUNNER_TEMP/segundo.log" 2>&1 &
          segundo=$!
          for i in $(seq 1 30); do kill -0 "$segundo" 2>/dev/null || break; sleep 2; done
          if kill -0 "$segundo" 2>/dev/null; then kill "$segundo"; echo "--- segundo.log"; cat "$RUNNER_TEMP/segundo.log"; ps aux | grep -i "[S]ocialHub" | head; echo "::error::El segundo arranque no terminó en 60 s: arrancaría dos veces"; exit 1; fi
          echo "--- segundo.log"; cat "$RUNNER_TEMP/segundo.log"
          echo "Segundo arranque terminó enseguida, como debe"
          curl -fsS --noproxy '*' -X POST -H 'X-SocialHub-Request: 1' http://127.0.0.1:8686/api/app/shutdown > /dev/null
          for i in $(seq 1 30); do kill -0 "$app" 2>/dev/null || break; sleep 2; done
          if kill -0 "$app" 2>/dev/null; then mostrar_registro; echo "::error::SocialHub no se cerró desde la web"; exit 1; fi
          if pgrep -f "SocialHub/runtime/.*/bin/postgres" > /dev/null; then echo "::error::PostgreSQL sigue en marcha después de cerrar"; exit 1; fi
          echo "Se cierra desde la web y para PostgreSQL"
      - name: Registro de SocialHub
        if: always()
        run: tail -80 "$HOME/Library/Application Support/SocialHub/logs/socialhub.log" 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        with:
          name: instalador-macos
          path: salida/*.dmg
          retention-days: 30
      - name: Publicar en la release
        if: inputs.publicar
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "v$VERSION" salida/*.dmg --clobber
