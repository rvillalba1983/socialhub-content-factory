name: Backend

on:
  push:
    branches: [main]
    paths: ["backend/**", ".github/workflows/backend.yml"]
  pull_request:
    paths: ["backend/**", ".github/workflows/backend.yml"]
  workflow_dispatch:
    inputs:
      otros_sistemas:
        description: "Probar también en otros sistemas (Windows gasta x2 minutos, macOS x10). En las PR, Windows va siempre"
        type: choice
        default: ninguno
        options: [ninguno, windows, windows-y-macos]

permissions:
  contents: read

jobs:
  linux:
    name: Compilar y probar (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      # En Linux, el FFmpeg incluido usa bibliotecas del sistema (dispositivos de audio y vídeo).
      # En Windows y macOS no hace falta instalar nada.
      - name: Bibliotecas del sistema para FFmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libxcb1 libxcb-shm0 libasound2t64 libpulse0 libva2 libva-drm2
      - run: mvn -B verify
      - name: Resumen de pruebas fallidas
        if: failure()
        shell: bash
        run: python3 ../.github/scripts/resumen-pruebas.py target/surefire-reports 2>/dev/null || python ../.github/scripts/resumen-pruebas.py target/surefire-reports
      - name: Informes de pruebas
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: informes-linux
          path: backend/target/surefire-reports

  otros-sistemas:
    name: Compilar y probar (${{ matrix.os }})
    # En las PR, Windows siempre (hasta tener una versión utilizable; después, también macOS). A mano, lo que se elija.
    if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.otros_sistemas != 'ninguno')
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON((github.event_name == 'pull_request' || inputs.otros_sistemas == 'windows') && '["windows-latest"]' || '["windows-latest","macos-latest"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - run: mvn -B verify
      # Arranque real: la web compilada dentro del jar, PostgreSQL incluido y la API en localhost:8686
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Compilar la web
        working-directory: frontend
        run: |
          npm ci
          npm run build
      - name: Empaquetar SocialHub con la web
        run: mvn -B -DskipTests clean package
      - name: Arrancar SocialHub y comprobar que responde
        shell: bash
        run: |
          java -jar target/socialhub.jar --socialhub.data-dir="$RUNNER_TEMP/socialhub" --socialhub.postgres.port=0 \
               --socialhub.demo.simulate=false > "$RUNNER_TEMP/socialhub.log" 2>&1 &
          for i in $(seq 1 90); do
            curl -sf http://localhost:8686/api/factory -o "$RUNNER_TEMP/factory.json" && break
            sleep 2
          done
          test -s "$RUNNER_TEMP/factory.json" || { echo "::error::SocialHub no respondió en localhost:8686"; cat "$RUNNER_TEMP/socialhub.log"; exit 1; }
          grep -q '"stations":\[' "$RUNNER_TEMP/factory.json" || { echo "::error::/api/factory sin estaciones"; exit 1; }
          curl -sf http://localhost:8686/ | grep -q '<div id="root">' || { echo "::error::La web no se sirve en localhost:8686"; exit 1; }
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST -H 'Content-Type: application/json' -d '{"type":"PAUSE"}' http://localhost:8686/api/tasks/t1/commands)
          test "$code" = "403" || { echo "::error::Una orden sin la cabecera de protección debería dar 403 y dio $code"; exit 1; }
          # Modo real: el motor comprueba FFmpeg y Java 2D al arrancar
          for i in $(seq 1 60); do
            curl -sf http://localhost:8686/api/tasks/check-local-tools | grep -q '"status":"COMPLETED"' && break
            sleep 2
          done
          curl -sf http://localhost:8686/api/tasks/check-local-tools | grep -q '"status":"COMPLETED"' \
            || { echo "::error::La comprobación de herramientas locales no terminó bien"; curl -s http://localhost:8686/api/tasks/check-local-tools; exit 1; }
          curl -sf http://localhost:8686/api/armory-items | grep -q '"id":"ffmpeg"' || { echo "::error::FFmpeg no está en la armería"; exit 1; }
          # Modo demo: base de datos aparte con los datos de ejemplo
          code=$(curl -s -o /dev/null -w '%{http_code}' -X PUT -H 'Content-Type: application/json' -H 'X-SocialHub-Request: 1' -d '{"mode":"DEMO"}' http://localhost:8686/api/app-mode)
          test "$code" = "200" || { echo "::error::Cambiar a modo demo debería dar 200 y dio $code"; exit 1; }
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST -H 'Content-Type: application/json' -H 'X-SocialHub-Request: 1' -d '{"type":"PAUSE"}' http://localhost:8686/api/tasks/t1/commands)
          test "$code" = "200" || { echo "::error::La orden PAUSE debería dar 200 y dio $code"; exit 1; }
          grep -E "PostgreSQL incluido en marcha|Started SocialHubApplication" "$RUNNER_TEMP/socialhub.log"
          echo "SocialHub arranca, sirve la web y la API en localhost:8686 y FFmpeg funciona"
      - name: Registro de SocialHub
        if: always()
        shell: bash
        run: cat "$RUNNER_TEMP/socialhub.log" 2>/dev/null | tail -60 || true
      - name: Resumen de pruebas fallidas
        if: failure()
        shell: bash
        run: python3 ../.github/scripts/resumen-pruebas.py target/surefire-reports 2>/dev/null || python ../.github/scripts/resumen-pruebas.py target/surefire-reports
      - name: Informes de pruebas
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: informes-${{ matrix.os }}
          path: backend/target/surefire-reports
