name: Frontend

on:
  push:
    branches: [main]
    paths: ["frontend/**", "contracts/**", ".github/workflows/frontend.yml"]
  pull_request:
    paths: ["frontend/**", "contracts/**", ".github/workflows/frontend.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Tipos, pruebas y compilación
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Los tipos de la API coinciden con el contrato OpenAPI
        working-directory: frontend/tools/openapi
        run: |
          npm ci
          npm run generate
          git diff --exit-code -- ../../src/api/schema.d.ts || (echo "::error::src/api/schema.d.ts no coincide con contracts/openapi.yaml. Ejecuta npm run generate en frontend/tools/openapi" && exit 1)
      - run: npm ci
      - run: npm test
      - run: npm run build
