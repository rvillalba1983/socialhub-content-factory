        items: { type: array, maxItems: 2, items: { $ref: "#/components/schemas/PubloraAccountInput" } }

    PublerAccount:
      type: object
      required: [platform, account_name]
      properties:
        platform: { $ref: "#/components/schemas/Platform" }
        account_name: { type: string, description: "Nombre de la cuenta en Publer («Litoques», «Lito · Litoques · El DeLito»)" }

    PublerAccountList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/PublerAccount" } }

    PublerAccountInput:
      type: object
      required: [platform, account_name]
      properties:
        platform: { $ref: "#/components/schemas/Platform" }
        account_name: { type: string, maxLength: 120 }

    PublerAccountListInput:
      type: object
      required: [items]
      properties:
        items: { type: array, maxItems: 2, items: { $ref: "#/components/schemas/PublerAccountInput" } }

    PublishRouteState:
      type: object
      required: [id, label, configured]
      properties:
        id: { type: string, enum: [PUBLER, PUBLORA, OFFICIAL] }
        label: { type: string }
        configured: { type: boolean }

    AiSettings:
      type: object
      required: [daily_limit, used_today, models]
      properties:
        daily_limit: { type: integer, format: int32 }
        used_today: { type: integer, format: int64, description: "Encargos enviados hoy (día de España)" }
        models: { type: array, items: { $ref: "#/components/schemas/AiTypeModel" } }

    AiSettingsInput:
      type: object
      required: [daily_limit, models]
      properties:
        daily_limit: { type: integer, format: int32, minimum: 0, maximum: 100 }
        models:
          type: array
          maxItems: 10
          items:
            type: object
            required: [type, model]
            properties:
              type: { $ref: "#/components/schemas/AiRequestType" }
              model: { $ref: "#/components/schemas/AiModel" }

    AiOrderInput:
      type: object
      required: [type, goal]
      properties:
        type: { $ref: "#/components/schemas/AiRequestType" }
        title: { type: string, maxLength: 120 }
        goal: { type: string, minLength: 1, maxLength: 4000 }
        inputs: { type: array, maxItems: 50, items: { type: string, maxLength: 2000 } }

    AiOrder:
      type: object
      required: [task_id]
      properties:
        task_id: { type: string }

    AiRequestPage:
      type: object
      required: [items, offset, limit, total]
      properties:
