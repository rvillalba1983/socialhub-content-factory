      properties:
        id: { type: string, description: idempotencyKey del encargo }
        task_id: { type: string }
        brand_id: { type: string }
        promotion_id: { type: string }
        type: { $ref: "#/components/schemas/AiRequestType" }
        model: { $ref: "#/components/schemas/AiModel" }
        attempt: { type: integer, format: int32 }
        status: { type: string, enum: [SENT, COMPLETED, FAILED, NEEDS_HUMAN, INVALID] }
        request_path: { type: string }
        result_path: { type: string }
        sent_at: { type: string, format: date-time }
        finished_at: { type: string, format: date-time }
        duration_ms: { type: integer, format: int64 }
        runtime: { type: string, description: "Agente que lo hizo, según el resultado" }
        result_model: { type: string, description: Modelo que dice haber usado }
        error: { type: string }

    BrandIdentity:
      type: object
      required: [tone, audience, forbidden_topics, preferred_expressions, forbidden_expressions, colors, font, logo,
                 visual_style, photo_style, call_to_action, fixed_hashtags]
      properties:
        tone: { type: string, maxLength: 2000, description: Tono de comunicación }
        audience: { type: string, maxLength: 2000, description: Público objetivo }
        forbidden_topics: { type: array, maxItems: 50, items: { type: string, maxLength: 200 }, description: Temas que no se tocan }
        preferred_expressions: { type: array, maxItems: 100, items: { type: string, maxLength: 200 } }
        forbidden_expressions:
          type: array
          maxItems: 100
          items: { type: string, maxLength: 200 }
          description: El control de calidad las busca en los textos (sin mayúsculas ni tildes)
        colors: { type: array, maxItems: 20, items: { type: string, maxLength: 40 } }
        font: { type: string, maxLength: 200 }
        logo: { type: string, maxLength: 500, description: Ruta o descripción del logotipo }
        visual_style: { type: string, maxLength: 2000 }
        photo_style: { type: string, maxLength: 2000 }
        call_to_action:
          type: string
          maxLength: 500
          description: Frase que debe aparecer en el texto de las publicaciones (salvo historias)
        fixed_hashtags: { type: string, maxLength: 1000, description: Hashtags que deben llevar todas las publicaciones }

    EditorialDecision:
      type: object
      required: [id, text, created_at]
      properties:
        id: { type: integer, format: int64 }
        text: { type: string }
        created_at: { type: string, format: date-time }

    EditorialDecisionList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/EditorialDecision" } }

    EditorialDecisionInput:
      type: object
      required: [text]
      properties:
        text: { type: string, minLength: 1, maxLength: 1000 }

    EditorialMemory:
