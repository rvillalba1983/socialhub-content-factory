openapi: 3.0.3
info:
  title: SocialHub API
  version: 1.0.0
  description: |
    API de SocialHub, la fábrica de contenido. Es la fuente de la verdad: el backend genera a partir de
    este contrato las interfaces de los controladores y los modelos.

    Sigue las guías REST de Zalando:
    - Propiedades en snake_case.
    - Rutas en kebab-case y en plural.
    - Valores de enumerados en UPPER_SNAKE_CASE.
    - Errores como application/problem+json.
    - Las acciones se modelan como comandos.

    Solo se sirve en 127.0.0.1. Las peticiones que cambian algo deben llevar la cabecera
    `X-SocialHub-Request: 1`, para que otras webs abiertas en el navegador no puedan actuar en nombre del usuario.
  x-api-id: a4dbd2e7-a299-4144-a36d-ada7464d7ea9
  x-audience: component-internal
  contact:
    name: Raúl Villalba
servers:
  - url: http://127.0.0.1:8686
tags:
  - name: Factory
    description: Vista completa del anillo de producción
  - name: AppMode
    description: Modo real o demo. Cada modo tiene su propia base de datos
  - name: Brands
  - name: Promotions
  - name: Publications
  - name: Claude
    description: Encargos a Claude por la carpeta de Drive de cada marca (SocialHub no llama a la API de Claude)
  - name: Pieces
    description: Piezas de Instagram a partir de un spec.json (lo que hacía promo.py)
  - name: Tasks
  - name: Stations
  - name: Armory
    description: Agentes, herramientas locales y servicios
  - name: ExternalOperations
    description: Seguimiento de las operaciones con sistemas externos
  - name: Publora
    description: Vía de publicación por la API de Publora (con la clave de Raúl)
  - name: Publer
    description: Cuenta de Publer que usa cada marca en cada red (Publer programa con Claude y Chrome, sin API)
  - name: Instagram
    description: Vía de publicación por la API oficial de Instagram (Meta Graph API, con la clave de usuario del sistema)
  - name: Backups
    description: Copias de seguridad de la base de datos real, en la carpeta de copias (ajuste general)
  - name: App
    description: La aplicación en sí (cerrarla desde la web)

paths:
  /api/factory:
    get:
      tags: [Factory]
      operationId: getFactory
      summary: Estado completo del anillo
      description: Estaciones, tareas, promociones, publicaciones, armería y avisos, leídos de la base de datos.
      responses:
        "200":
          description: Estado del anillo
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Factory" }
        default: { $ref: "#/components/responses/Problem" }

  /api/app-mode:
    get:
      tags: [AppMode]
      operationId: getAppMode
      responses:
        "200":
          description: Modo actual
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AppModeState" }
        default: { $ref: "#/components/responses/Problem" }
    put:
      tags: [AppMode]
      operationId: changeAppMode
      summary: Cambia de modo
      description: Las peticiones siguientes usan la base de datos del nuevo modo. Se recuerda al reiniciar.
      parameters:
        - $ref: "#/components/parameters/RequestGuard"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AppModeChange" }
      responses:
        "200":
          description: Modo después del cambio
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AppModeState" }
        "409": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }

  /api/brands:
    get:
      tags: [Brands]
      operationId: listBrands
      responses:
        "200":
          description: Marcas
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BrandList" }
        default: { $ref: "#/components/responses/Problem" }
    post:
      tags: [Brands]
      operationId: createBrand
      parameters:
        - $ref: "#/components/parameters/RequestGuard"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BrandInput" }
      responses:
        "201":
          description: Marca creada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Brand" }
        "400": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }

  /api/brands/{brand_id}:
    put:
      tags: [Brands]
      operationId: updateBrand
      parameters:
        - $ref: "#/components/parameters/BrandId"
        - $ref: "#/components/parameters/RequestGuard"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BrandInput" }
      responses:
        "200":
          description: Marca actualizada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Brand" }
        "400": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }

  /api/brands/{brand_id}/folders:
    get:
      tags: [Brands]
      operationId: listBrandFolders
      summary: Papeles de carpeta de la marca
      parameters:
        - $ref: "#/components/parameters/BrandId"
      responses:
        "200":
          description: Carpeta de cada papel
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FolderList" }
        "404": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }
    put:
      tags: [Brands]
      operationId: replaceBrandFolders
      summary: Sustituye los papeles de carpeta de la marca
      description: Las promociones de la marca los heredan, salvo los que cada una cambie.
      parameters:
        - $ref: "#/components/parameters/BrandId"
        - $ref: "#/components/parameters/RequestGuard"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FolderListInput" }
      responses:
        "200":
          description: Papeles guardados
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FolderList" }
        "400": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }

  /api/brands/{brand_id}/folders/creation:
    post:
      tags: [Brands]
      operationId: createBrandFolders
      summary: Crea las carpetas de la marca que falten
      description: >
        Con «base», los papeles sin carpeta pasan a ser subcarpetas suyas (Material, Borradores, Generados, Aprobados,
        Publicados, Informes y Encargos). Después crea las carpetas asignadas que no existan. Nunca borra, mueve ni
        cambia carpetas que ya existan.
      parameters:
        - $ref: "#/components/parameters/BrandId"
        - $ref: "#/components/parameters/RequestGuard"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FolderCreationInput" }
      responses:
        "200":
          description: Carpetas de la marca, ya creadas
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FolderList" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }

  /api/promotions/{promotion_id}/external-calendar:
    get:
      tags: [Publications]
      operationId: getExternalCalendar
      summary: Lo programado o publicado fuera de SocialHub (Publora, Publer y la red) para la marca de la promoción
      description: >
        Publora se lee por su API cada hora; Publer y lo publicado en la red, con el encargo diario «Leer calendario»
        a Claude con Chrome. Lo que corresponde a una publicación de SocialHub lleva su publication_id.
      parameters:
        - $ref: "#/components/parameters/PromotionId"
        - { name: from, in: query, required: true, schema: { type: string, format: date } }
        - { name: to, in: query, required: true, schema: { type: string, format: date } }
      responses:
        "200":
          description: Calendario de fuera
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExternalCalendar" }
        "404": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }

  /api/app/shutdown:
    post:
      tags: [App]
      operationId: shutdownApp
      summary: Cierra SocialHub
      description: >
        Para el motor, PostgreSQL y el servidor, como al cerrar el programa. Funciona también si SocialHub está parado
        tras restaurar una copia. Lo que quedó a medias vuelve a la cola al abrirlo de nuevo.
      parameters:
        - $ref: "#/components/parameters/RequestGuard"
      responses:
        "202": { description: SocialHub se está cerrando }
        default: { $ref: "#/components/responses/Problem" }

  /api/backups:
    get:
      tags: [Backups]
      operationId: getBackups
      summary: Carpeta de copias y copias guardadas
      description: >
        Lista las copias de la carpeta elegida y las de la carpeta local de SocialHub (donde se guardan mientras no
        hay carpeta elegida o si no está disponible).
      responses:
        "200":
          description: Copias
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BackupList" }
        default: { $ref: "#/components/responses/Problem" }
    post:
      tags: [Backups]
      operationId: createBackup
      summary: Hace una copia ahora
      parameters:
        - $ref: "#/components/parameters/RequestGuard"
      responses:
        "201":
          description: Copia hecha
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Backup" }
        default: { $ref: "#/components/responses/Problem" }

  /api/backups/folder:
    put:
      tags: [Backups]
      operationId: saveBackupFolder
      summary: Elige la carpeta de copias (o la quita, con folder vacío)
      description: La carpeta tiene que existir. Es un ajuste general, no de una marca.
      parameters:
        - $ref: "#/components/parameters/RequestGuard"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BackupFolderInput" }
      responses:
        "200":
          description: Carpeta guardada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BackupList" }
        "409": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }

  /api/backups/restorations:
    post:
      tags: [Backups]
      operationId: restoreBackup
      summary: Restaura una copia
      description: >
        Primero hace una copia de lo actual («antes-de-restaurar»). Hay que confirmar escribiendo el nombre de la copia.
        Después SocialHub se para y pide cerrarlo y volver a abrirlo.
      parameters:
        - $ref: "#/components/parameters/RequestGuard"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RestorationInput" }
      responses:
        "200":
          description: Copia restaurada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Restoration" }
        "409": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }

  /api/publora:
    get:
      tags: [Publora]
      operationId: getPublora
      summary: Si Publora está configurada y qué cuentas tiene conectadas
      description: >
        La clave nunca sale de SocialHub: solo se indican sus últimos caracteres. Con clave, consulta a Publora sus
        cuentas conectadas; si falla, lo dice en «error».
      responses:
        "200":
          description: Estado de Publora
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PubloraStatus" }
        default: { $ref: "#/components/responses/Problem" }

  /api/publora/key:
    put:
      tags: [Publora]
      operationId: savePubloraKey
      summary: Guarda la clave de la API de Publora
      description: >
        Antes de guardarla comprueba con Publora que es válida. Se guarda en un archivo de la carpeta de datos de
        SocialHub, legible solo por el usuario; nunca en la base de datos.
      parameters:
        - $ref: "#/components/parameters/RequestGuard"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PubloraKeyInput" }
      responses:
        "200":
          description: Clave guardada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PubloraStatus" }
        "400": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }
    delete:
      tags: [Publora]
      operationId: deletePubloraKey
      summary: Borra la clave de Publora (la vía queda sin configurar)
      parameters:
        - $ref: "#/components/parameters/RequestGuard"
      responses:
        "204": { description: Clave borrada }
        default: { $ref: "#/components/responses/Problem" }

  /api/instagram:
    get:
      tags: [Instagram]
      operationId: getInstagram
      summary: Si la API oficial de Instagram tiene clave
      description: >
        La clave nunca sale de SocialHub: solo se indican sus últimos caracteres. No llama a Meta (para comprobarla,
        «POST /api/instagram/check»).
      responses:
        "200":
          description: Estado de la API oficial
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InstagramStatus" }
        default: { $ref: "#/components/responses/Problem" }

  /api/instagram/key:
    put:
      tags: [Instagram]
      operationId: saveInstagramKey
      summary: Guarda la clave de usuario del sistema de Meta
      description: >
        Antes de guardarla la comprueba con Meta (GET /me). Es una clave de «usuario del sistema» del porfolio de Meta,
        sin caducidad, con los permisos instagram_basic e instagram_content_publish. Se guarda en un archivo de la carpeta
        de datos de SocialHub, legible solo por el usuario; nunca en la base de datos.
      parameters:
        - $ref: "#/components/parameters/RequestGuard"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/InstagramKeyInput" }
      responses:
        "200":
          description: Clave guardada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InstagramStatus" }
        "400": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }
    delete:
      tags: [Instagram]
      operationId: deleteInstagramKey
      summary: Borra la clave (la API oficial queda sin configurar)
      parameters:
        - $ref: "#/components/parameters/RequestGuard"
      responses:
        "204": { description: Clave borrada }
        default: { $ref: "#/components/responses/Problem" }

  /api/instagram/check:
    post:
      tags: [Instagram]
      operationId: checkInstagram
      summary: Comprueba la clave con Meta y el límite de publicación de cada marca configurada
      description: >
        Llama a GET /me y, por cada marca con cuenta de Instagram, a GET /{ig-id} y a content_publishing_limit. Un fallo
        de Meta no es un error de la API: va en «error» de lo que falló.
      parameters:
        - $ref: "#/components/parameters/RequestGuard"
      responses:
        "200":
          description: Resultado de la comprobación
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InstagramCheck" }
        default: { $ref: "#/components/responses/Problem" }

  /api/brands/{brand_id}/instagram-account:
    get:
      tags: [Instagram]
      operationId: getBrandInstagramAccount
      summary: Cuenta de Instagram (API oficial) de la marca
      parameters:
        - $ref: "#/components/parameters/BrandId"
      responses:
        "200":
          description: Cuenta de la marca (vacía si no tiene)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InstagramAccount" }
        "404": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }
    put:
      tags: [Instagram]
      operationId: saveBrandInstagramAccount
      summary: Guarda la cuenta de Instagram (API oficial) de la marca
      description: >
        Recibe el identificador de la cuenta (número largo). Lo comprueba con Meta (GET /{ig-id}?fields=id,username) y
        guarda el @usuario. Vacío: la quita. Hace falta la clave.
      parameters:
        - $ref: "#/components/parameters/BrandId"
        - $ref: "#/components/parameters/RequestGuard"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/InstagramAccountInput" }
      responses:
        "200":
          description: Cuenta guardada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InstagramAccount" }
        "400": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }

  /api/brands/{brand_id}/publora-accounts:
    get:
      tags: [Publora]
      operationId: getBrandPubloraAccounts
      summary: Qué cuenta de Publora usa la marca en cada red
      parameters:
        - $ref: "#/components/parameters/BrandId"
      responses:
        "200":
          description: Cuentas elegidas
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PubloraAccountList" }
        "404": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }
    put:
      tags: [Publora]
      operationId: saveBrandPubloraAccounts
      summary: Elige la cuenta de Publora de la marca en cada red
      description: Cada cuenta tiene que estar conectada en Publora y ser de esa red. Una lista vacía las quita.
      parameters:
        - $ref: "#/components/parameters/BrandId"
        - $ref: "#/components/parameters/RequestGuard"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PubloraAccountListInput" }
      responses:
        "200":
          description: Cuentas guardadas
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PubloraAccountList" }
        "400": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }

  /api/brands/{brand_id}/publora-dismissed:
    put:
      tags: [Publora]
      operationId: setBrandPubloraDismissed
      summary: Marca o desmarca «No uso Publora» para la marca
      description: >
        Con el descarte, «Qué hacer ahora» deja de recomendar conectar Publora para esa marca. Se puede deshacer
        en cualquier momento. No toca las cuentas elegidas.
      parameters:
        - $ref: "#/components/parameters/BrandId"
        - $ref: "#/components/parameters/RequestGuard"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PubloraDismissedInput" }
      responses:
        "200":
          description: Estado guardado (con las cuentas de la marca)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PubloraAccountList" }
        "404": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }

  /api/brands/{brand_id}/publer-accounts:
    get:
      tags: [Publer]
      operationId: getBrandPublerAccounts
      summary: Qué cuenta de Publer usa la marca en cada red
      parameters:
        - $ref: "#/components/parameters/BrandId"
      responses:
        "200":
          description: Cuentas indicadas
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PublerAccountList" }
        "404": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }
    put:
      tags: [Publer]
      operationId: saveBrandPublerAccounts
      summary: Indica la cuenta de Publer de la marca en cada red
      description: >
        Es el nombre de la cuenta tal como sale en Publer. Dos marcas pueden indicar la misma (por ejemplo, la de TikTok,
        que usan las dos). Una lista vacía las quita; una red con el nombre vacío se quita.
      parameters:
        - $ref: "#/components/parameters/BrandId"
        - $ref: "#/components/parameters/RequestGuard"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PublerAccountListInput" }
      responses:
        "200":
          description: Cuentas guardadas
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PublerAccountList" }
        "400": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }

  /api/brands/{brand_id}/identity:
    get:
      tags: [Brands]
      operationId: getBrandIdentity
      summary: Identidad de la marca (la heredan sus promociones)
      parameters:
        - $ref: "#/components/parameters/BrandId"
      responses:
        "200":
          description: Identidad; los campos sin rellenar van vacíos
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BrandIdentity" }
        "404": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }
    put:
      tags: [Brands]
      operationId: saveBrandIdentity
      parameters:
        - $ref: "#/components/parameters/BrandId"
        - $ref: "#/components/parameters/RequestGuard"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BrandIdentity" }
      responses:
        "200":
          description: Identidad guardada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BrandIdentity" }
        "400": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }

  /api/brands/{brand_id}/decisions:
    get:
      tags: [Brands]
      operationId: listBrandDecisions
      summary: Decisiones editoriales de la marca
      parameters:
        - $ref: "#/components/parameters/BrandId"
      responses:
        "200":
          description: Por orden de alta
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EditorialDecisionList" }
        "404": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }
    post:
      tags: [Brands]
      operationId: addBrandDecision
      parameters:
        - $ref: "#/components/parameters/BrandId"
        - $ref: "#/components/parameters/RequestGuard"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EditorialDecisionInput" }
      responses:
        "201":
          description: Decisión añadida
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EditorialDecision" }
        "400": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }

  /api/brands/{brand_id}/decisions/{decision_id}:
    delete:
      tags: [Brands]
      operationId: deleteBrandDecision
      parameters:
        - $ref: "#/components/parameters/BrandId"
        - name: decision_id
          in: path
          required: true
          schema: { type: integer, format: int64 }
        - $ref: "#/components/parameters/RequestGuard"
      responses:
        "204": { description: Decisión borrada }
        "404": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }

  /api/brands/{brand_id}/editorial-memory:
    get:
      tags: [Publications]
      operationId: getEditorialMemory
      summary: Memoria editorial de la marca (lo que va en cada encargo a Claude)
      parameters:
        - $ref: "#/components/parameters/BrandId"
      responses:
        "200":
          description: Decisiones, rechazos, correcciones y lo publicado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EditorialMemory" }
        "404": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }

  /api/promotions:
    get:
      tags: [Promotions]
      operationId: listPromotions
      responses:
        "200":
          description: Promociones
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PromotionList" }
        default: { $ref: "#/components/responses/Problem" }
    post:
      tags: [Promotions]
      operationId: createPromotion
      parameters:
        - $ref: "#/components/parameters/RequestGuard"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PromotionInput" }
      responses:
        "201":
          description: Promoción creada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Promotion" }
        "400": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }

  /api/promotions/{promotion_id}:
    get:
      tags: [Promotions]
      operationId: getPromotion
      parameters:
        - $ref: "#/components/parameters/PromotionId"
      responses:
        "200":
          description: Promoción con todo lo que muestra su centro de control
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Promotion" }
        "404": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }
    put:
      tags: [Promotions]
      operationId: updatePromotion
      parameters:
        - $ref: "#/components/parameters/PromotionId"
        - $ref: "#/components/parameters/RequestGuard"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PromotionInput" }
      responses:
        "200":
          description: Promoción actualizada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Promotion" }
        "400": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }

  /api/promotions/{promotion_id}/folders:
    get:
      tags: [Promotions]
      operationId: listPromotionFolders
      summary: Papeles de carpeta en vigor de la promoción
      description: Los de la marca, salvo los que la promoción cambia. Indica si cada carpeta está accesible ahora.
      parameters:
        - $ref: "#/components/parameters/PromotionId"
      responses:
        "200":
          description: Carpeta de cada papel
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FolderList" }
        "404": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }
    put:
      tags: [Promotions]
      operationId: replacePromotionFolders
      summary: Sustituye las excepciones de la promoción
      description: Solo los papeles que la promoción cambia respecto a su marca.
      parameters:
        - $ref: "#/components/parameters/PromotionId"
        - $ref: "#/components/parameters/RequestGuard"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FolderListInput" }
      responses:
        "200":
          description: Papeles en vigor después del cambio
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FolderList" }
        "400": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }

  /api/promotions/{promotion_id}/piece-specs:
    get:
      tags: [Pieces]
      operationId: listPieceSpecs
      summary: spec.json de la carpeta vigilada de la promoción
      description: >
        Busca en la carpeta con el papel «Encargos». Si la promoción no tiene ese papel, en «SocialHub/encargos»
        dentro de su primera carpeta.
      parameters:
        - $ref: "#/components/parameters/PromotionId"
      responses:
        "200":
          description: spec.json encontrados
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PieceSpecList" }
        "404": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }

  /api/promotions/{promotion_id}/piece-orders:
    post:
      tags: [Pieces]
      operationId: createPieceOrder
      summary: Encarga las piezas de un spec.json
      description: Valida el spec (rutas dentro de las carpetas de la promoción, formatos y tamaños) y crea la tarea.
      parameters:
        - $ref: "#/components/parameters/PromotionId"
        - $ref: "#/components/parameters/RequestGuard"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PieceOrderInput" }
      responses:
        "201":
          description: Tarea creada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PieceOrder" }
        "400": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }

  /api/promotions/{promotion_id}/publications:
    get:
      tags: [Publications]
      operationId: listPublications
      summary: Publicaciones de una promoción, con filtros
      parameters:
        - $ref: "#/components/parameters/PromotionId"
        - name: status
          in: query
          description: Uno o varios estados
          schema:
            type: array
            items: { $ref: "#/components/schemas/PublicationStatus" }
          style: form
          explode: false
        - name: platform
          in: query
          schema: { $ref: "#/components/schemas/Platform" }
        - name: from
          in: query
          description: Desde esta fecha (incluida)
          schema: { type: string, format: date }
        - name: to
          in: query
          description: Hasta esta fecha (incluida)
          schema: { type: string, format: date }
        - name: flagged
          in: query
          description: Solo las que tienen una incidencia anotada
          schema: { type: boolean }
        - $ref: "#/components/parameters/Offset"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Página de publicaciones
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PublicationPage" }
        "404": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }
    post:
      tags: [Publications]
      operationId: createPublication
      summary: Da de alta una publicación
      description: Empieza como idea, propuesta, en producción o borrador. El identificador lo asigna SocialHub.
      parameters:
        - $ref: "#/components/parameters/PromotionId"
        - $ref: "#/components/parameters/RequestGuard"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PublicationInput" }
      responses:
        "201":
          description: Publicación creada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Publication" }
        "400": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }

  /api/publications/{publication_id}:
    put:
      tags: [Publications]
      operationId: updatePublication
      summary: Edita los datos de una publicación
      description: >
        No cambia el estado. No se puede editar una publicación que se está publicando o ya publicada; si está
        programada, la nueva hora debe quedar al menos a 6 horas de ahora.
      parameters:
        - $ref: "#/components/parameters/PublicationId"
        - $ref: "#/components/parameters/RequestGuard"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PublicationInput" }
      responses:
        "200":
          description: Publicación actualizada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Publication" }
        "400": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }

  /api/publications/{publication_id}/files:
    get:
      tags: [Publications]
      operationId: listPublicationFiles
      summary: Archivos asociados a una publicación
      parameters:
        - $ref: "#/components/parameters/PublicationId"
      responses:
        "200":
          description: Archivos, por orden de alta
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PublicationFileList" }
        "404": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }
    post:
      tags: [Publications]
      operationId: attachPublicationFile
      summary: Asocia a mano un archivo
      description: El archivo debe existir y estar dentro de las carpetas de la promoción.
      parameters:
        - $ref: "#/components/parameters/PublicationId"
        - $ref: "#/components/parameters/RequestGuard"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PublicationFileInput" }
      responses:
        "201":
          description: Archivo asociado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PublicationFile" }
        "400": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }
    delete:
      tags: [Publications]
      operationId: detachPublicationFile
      summary: Quita la asociación de un archivo
      description: El archivo no se borra ni se mueve.
      parameters:
        - $ref: "#/components/parameters/PublicationId"
        - $ref: "#/components/parameters/RequestGuard"
        - name: path
          in: query
          required: true
          schema: { type: string }
      responses:
        "204": { description: Asociación quitada }
        "404": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }

  /api/publications/{publication_id}/quality:
    get:
      tags: [Publications]
      operationId: getPublicationQuality
      summary: Control de calidad de una publicación
      description: >
        Avisos de las comprobaciones automáticas (en el momento) y de la última revisión de Claude, con las
        aceptaciones de Raúl. Mientras quede alguno abierto, no pasa a «Aprobada» ni a «Programada».
      parameters:
        - $ref: "#/components/parameters/PublicationId"
      responses:
        "200":
          description: Avisos
          content:
            application/json:
              schema: { $ref: "#/components/schemas/QualityReport" }
        "404": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }

  /api/publications/{publication_id}/flag:
    delete:
      tags: [Publications]
      operationId: clearPublicationFlag
      summary: Da por resuelta la incidencia anotada en la publicación
      parameters:
        - $ref: "#/components/parameters/PublicationId"
        - $ref: "#/components/parameters/RequestGuard"
      responses:
        "204": { description: Incidencia resuelta }
        "404": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }

  /api/publications/{publication_id}/metrics:
    get:
      tags: [Publications]
      operationId: getPublicationMetrics
      summary: Métricas de la publicación (se leen una vez, a los 7 días de publicarse)
      description: Lo que no se pudo ver queda sin dato. 404 si aún no se han pedido.
      parameters:
        - $ref: "#/components/parameters/PublicationId"
      responses:
        "200":
          description: Métricas
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PublicationMetrics" }
        "404": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }

  /api/publications/{publication_id}/publish-job:
    get:
      tags: [Publications]
      operationId: getPublishJob
      summary: Cómo va la publicación de una publicación programada
      description: >
        Vía en uso (Publer, Publora o API oficial), estado, próximo intento e historial. 404 si nunca se ha
        programado.
      parameters:
        - $ref: "#/components/parameters/PublicationId"
      responses:
        "200":
          description: Tarea de publicación
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PublishJob" }
        "404": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }

  /api/publications/{publication_id}/quality-acceptances:
    post:
      tags: [Publications]
      operationId: acceptQualityIssue
      summary: Acepta un aviso concreto, con su motivo
      parameters:
        - $ref: "#/components/parameters/PublicationId"
        - $ref: "#/components/parameters/RequestGuard"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/QualityAcceptance" }
      responses:
        "200":
          description: Avisos después de aceptarlo
          content:
            application/json:
              schema: { $ref: "#/components/schemas/QualityReport" }
        "400": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }

  /api/publications/{publication_id}/text-rejections:
    post:
      tags: [Publications]
      operationId: rejectPublicationText
      summary: Descarta el texto y los hashtags de la publicación, con su motivo
      description: El texto descartado y el motivo quedan en la memoria editorial de la marca.
      parameters:
        - $ref: "#/components/parameters/PublicationId"
        - $ref: "#/components/parameters/RequestGuard"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TextRejection" }
      responses:
        "200":
          description: Publicación sin texto
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Publication" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }

  /api/publications/{publication_id}/status-changes:
    post:
      tags: [Publications]
      operationId: changePublicationStatus
      summary: Cambia el estado de una publicación
      description: >
        Para cancelar hace falta «reason»: el rechazo queda en la memoria editorial de la marca.
        Solo transiciones permitidas por su ciclo de vida. «Publicando», «Publicada» y «Error de publicación» los
        pone SocialHub al publicar, nunca a mano. Para programarla, la hora debe quedar al menos a 6 horas de ahora.
      parameters:
        - $ref: "#/components/parameters/PublicationId"
        - $ref: "#/components/parameters/RequestGuard"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PublicationStatusChange" }
      responses:
        "200":
          description: Publicación con su nuevo estado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Publication" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }

  /api/ai/settings:
    get:
      tags: [Claude]
      operationId: getAiSettings
      summary: Límite diario y modelo de cada tipo de encargo
      responses:
        "200":
          description: Ajustes y encargos enviados hoy
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AiSettings" }
        default: { $ref: "#/components/responses/Problem" }
    put:
      tags: [Claude]
      operationId: updateAiSettings
      parameters:
        - $ref: "#/components/parameters/RequestGuard"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AiSettingsInput" }
      responses:
        "200":
          description: Ajustes guardados
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AiSettings" }
        "400": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }

  /api/ai/requests:
    get:
      tags: [Claude]
      operationId: listAiRequests
      summary: Registro de envíos a Claude, del más reciente al más antiguo
      description: Tokens y coste no figuran porque Claude Pro no los expone (se muestran como desconocidos).
      parameters:
        - $ref: "#/components/parameters/Offset"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Página de envíos
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AiRequestPage" }
        default: { $ref: "#/components/responses/Problem" }

  /api/promotions/{promotion_id}/ai-orders:
    post:
      tags: [Claude]
      operationId: createAiOrder
      summary: Encarga un trabajo a Claude
      description: >
        Crea la tarea en cola. Sale hacia «<Encargos de la marca>/para-claude» en el siguiente envío (cada 30 s), si no
        se ha llegado al límite diario. La tarea programada «Encargos de SocialHub» deja el resultado en «de-claude».
      parameters:
        - $ref: "#/components/parameters/PromotionId"
        - $ref: "#/components/parameters/RequestGuard"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AiOrderInput" }
      responses:
        "201":
          description: Encargo en cola
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AiOrder" }
        "400": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }

  /api/tasks:
    get:
      tags: [Tasks]
      operationId: listTasks
      parameters:
        - name: station_id
          in: query
          schema: { type: string }
        - name: promotion_id
          in: query
          schema: { type: string }
        - name: status
          in: query
          schema:
            type: array
            items: { $ref: "#/components/schemas/TaskStatus" }
          style: form
          explode: false
        - name: human
          in: query
          description: Solo las que esperan a Raúl
          schema: { type: boolean }
      responses:
        "200":
          description: Tareas
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TaskList" }
        default: { $ref: "#/components/responses/Problem" }

  /api/tasks/{task_id}:
    get:
      tags: [Tasks]
      operationId: getTask
      parameters:
        - $ref: "#/components/parameters/TaskId"
      responses:
        "200":
          description: Tarea
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Task" }
        "404": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }

  /api/tasks/{task_id}/commands:
    post:
      tags: [Tasks]
      operationId: executeTaskCommand
      summary: Ejecuta un comando sobre la tarea
      description: |
        Solo se aceptan los comandos que la tarea ofrece en `available_commands`. Si no, responde 409.
      parameters:
        - $ref: "#/components/parameters/TaskId"
        - $ref: "#/components/parameters/RequestGuard"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TaskCommand" }
      responses:
        "200":
          description: Tarea tras aplicar el comando
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Task" }
        "400": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }

  /api/stations:
    get:
      tags: [Stations]
      operationId: listStations
      responses:
        "200":
          description: Estaciones del anillo, en orden
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StationList" }
        default: { $ref: "#/components/responses/Problem" }

  /api/stations/{station_id}/commands:
    post:
      tags: [Stations]
      operationId: executeStationCommand
      parameters:
        - name: station_id
          in: path
          required: true
          schema: { type: string }
        - $ref: "#/components/parameters/RequestGuard"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StationCommand" }
      responses:
        "200":
          description: Estación tras aplicar el comando
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Station" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }

  /api/armory-items:
    get:
      tags: [Armory]
      operationId: listArmoryItems
      responses:
        "200":
          description: Agentes, herramientas y servicios
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ArmoryItemList" }
        default: { $ref: "#/components/responses/Problem" }

  /api/external-operations:
    get:
      tags: [ExternalOperations]
      operationId: listExternalOperations
      summary: Operaciones con sistemas externos, las más recientes primero
      parameters:
        - name: system
          in: query
          schema: { type: string }
          description: Sistema externo (postgres, google-drive, publer, instagram-api…)
        - name: outcome
          in: query
          schema: { $ref: "#/components/schemas/OperationOutcome" }
        - $ref: "#/components/parameters/Offset"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Página de operaciones
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExternalOperationPage" }
        default: { $ref: "#/components/responses/Problem" }

  # Avisos en directo. Se implementa a mano (Server-Sent Events): no se generan interfaces para este tag.
  /api/events:
    get:
      tags: [Events]
      operationId: streamEvents
      summary: Avisos en directo (Server-Sent Events)
      description: |
        Eventos `factory-changed` con `{"kind": "TASK", "id": "…"}` cada vez que algo cambia, y `ping` cada 25 s.
      responses:
        "200":
          description: Flujo de eventos
          content:
            text/event-stream:
              schema: { type: string }

components:
  parameters:
    PromotionId:
      name: promotion_id
      in: path
      required: true
      schema: { type: string }
    TaskId:
      name: task_id
      in: path
      required: true
      schema: { type: string }
    Offset:
      name: offset
      in: query
      schema: { type: integer, format: int32, minimum: 0, default: 0 }
    Limit:
      name: limit
      in: query
      schema: { type: integer, format: int32, minimum: 1, maximum: 500, default: 100 }
    PublicationId:
      name: publication_id
      in: path
      required: true
      schema: { type: string }
    BrandId:
      name: brand_id
      in: path
      required: true
      schema: { type: string }
    RequestGuard:
      name: X-SocialHub-Request
      in: header
      required: true
      description: Debe valer 1. Impide que otras webs abiertas en el navegador hagan peticiones en nombre del usuario.
      schema: { type: string, enum: ["1"] }

  responses:
    Problem:
      description: Error
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }

  schemas:
    Problem:
      type: object
      properties:
        type: { type: string, format: uri }
        title: { type: string }
        status: { type: integer, format: int32 }
        detail: { type: string }
        instance: { type: string, format: uri }

    StatusLevel:
      description: Estado visual común (estaciones, servicios, rutas)
      type: string
      enum: [OK, RUNNING, WAITING, BLOCKED, FAILED, IDLE, CANCELLED]

    TaskStatus:
      type: string
      enum: [IDLE, QUEUED, RUNNING, WAITING, BLOCKED, FAILED, COMPLETED, CANCELLED]

    TaskCommandType:
      type: string
      enum: [PAUSE, RESUME, CANCEL, DISCARD, RETRY, SWITCH_TO_MANUAL, RUN_NOW, RESCHEDULE, RECHECK, START, RERUN,
             REOPEN, APPROVE, MARK_DONE, REMIND, CHANGE_AGENT]

    AgentKind:
      type: string
      enum: [AI, LOCAL, HUMAN, BROWSER, CONNECTOR]

    AiModel:
      type: string
      enum: [HAIKU, SONNET, OPUS]

    PublicationStatus:
      type: string
      enum: [IDEA, PROPOSAL, IN_PRODUCTION, DRAFT, IN_REVIEW, APPROVED, SCHEDULED, PUBLISHING, PUBLISHED,
             PUBLISH_ERROR, CANCELLED]

    Platform:
      type: string
      enum: [INSTAGRAM, TIKTOK]

    OperationOutcome:
      type: string
      enum: [SUCCESS, FAILURE]

    Factory:
      type: object
      required: [now, demo, brands, promotions, stations, tasks, publications, armory_items, common_rules, alerts, recommendations]
      properties:
        now: { type: string, format: date-time }
        demo:
          type: boolean
          description: Los datos son de ejemplo
        brands: { type: array, items: { $ref: "#/components/schemas/Brand" } }
        promotions: { type: array, items: { $ref: "#/components/schemas/Promotion" } }
        stations: { type: array, items: { $ref: "#/components/schemas/Station" } }
        tasks: { type: array, items: { $ref: "#/components/schemas/Task" } }
        publications: { type: array, items: { $ref: "#/components/schemas/Publication" } }
        armory_items: { type: array, items: { $ref: "#/components/schemas/ArmoryItem" } }
        common_rules: { type: array, items: { type: string } }
        alerts: { type: array, items: { $ref: "#/components/schemas/Alert" } }
        recommendations:
          type: array
          description: >
            «Qué hacer ahora»: la lista completa de recomendaciones, por orden de prioridad (el frontal enseña las 3
            primeras y el resto bajo «Ver N más»). Se calculan en cada consulta, sin
            guardarlas, y desaparecen solas cuando dejan de hacer falta. Siempre vacía en modo demo.
          items: { $ref: "#/components/schemas/Recommendation" }

    Recommendation:
      type: object
      required: [id, kind, title]
      properties:
        id:
          type: string
          description: "Estable mientras la recomendación siga haciendo falta (por ejemplo, brand-folders:litoques)"
        kind:
          type: string
          enum:
            - HELD_PROPOSALS
            - PROPOSALS_TO_REVIEW
            - BRAND_FOLDERS_MISSING
            - ORDERS_NOT_COLLECTED
            - PUBLORA_MISSING
            - BACKUP_FOLDER_MISSING
            - NO_ACTIVE_PROMOTION
            - PROPOSALS_PENDING
            - SPEC_WAITING
            - PC_TASK_SILENT
            - NO_PUBLISHING_ROUTE
            - PUBLER_ACCOUNT_MISSING
            - PROMOTION_AUTO_STARTED
          description: >
            Por orden de prioridad: marca sin forma de publicar (NO_PUBLISHING_ROUTE) y tarea del PC «Publicar con
            Chrome» sin contestar (PC_TASK_SILENT), que van primero porque bloquean publicaciones reales (también salen
            como aviso en «Necesita atención»); marca sin cuenta de Publer para una red con publicaciones retenidas
            (PUBLER_ACCOUNT_MISSING, con botón a la tarjeta «Cuenta en Publer»); propuestas retenidas (por la carpeta de Encargos, Drive cerrado o el límite
            diario), propuestas por revisar, marca sin todas sus carpetas, encargos
            sin recoger, marca sin cuenta de Publora, sin carpeta de copias, marca sin promoción activa, propuestas
            pedidas en camino, especificación semanal esperando publicaciones aprobadas y, la última, promoción activada
            sola hoy (PROMOTION_AUTO_STARTED, informativa: solo el día en que se activa)
        title: { type: string, description: "Texto en español" }
        detail: { type: string, description: "Más información (por ejemplo, el motivo de un encargo retenido)" }
        promotion_id:
          type: string
          description: >
            Promoción a la que se refiere la recomendación (propuestas retenidas, por revisar o en camino). La
            interfaz usa este campo y no lo deduce del id ni del título
        eta_text:
          type: string
          description: >
            Solo en propuestas en camino: cuándo llegarán, en español («sobre las 9:40» o «mañana sobre las 9:40»).
            La interfaz usa este campo y no lo deduce del título
        target:
          $ref: "#/components/schemas/RecommendationTarget"

    RecommendationTarget:
      type: object
      description: A qué pantalla lleva el botón. Sin target, la recomendación es solo un texto.
      required: [screen]
      properties:
        screen:
          type: string
          enum: [BRAND_FOLDERS, PROPOSALS, PUBLORA, PUBLER, BACKUPS, NEW_PROMOTION, CLAUDE]
          description: >
            BRAND_FOLDERS: Marcas → Carpetas de Drive de la marca (brand_id). PROPOSALS: publicaciones en estado
            Propuesta de la promoción (promotion_id). PUBLORA: tarjeta de Publora de la marca (brand_id). PUBLER: tarjeta «Cuenta en Publer» de la marca (brand_id). BACKUPS:
            ajuste de la carpeta de copias. NEW_PROMOTION: alta de promoción de la marca (brand_id); con promotion_id, abre esa promoción (planificada o en
            pausa) para activarla. CLAUDE: pantalla «Claude», donde se cambia el límite diario de encargos (sin brand_id)
        brand_id: { type: string }
        promotion_id: { type: string }

    Alert:
      type: object
      required: [kind, target_type, target_id, station_id, title, detail]
      properties:
        kind: { type: string, enum: [FAILED, BLOCKED] }
        target_type:
          type: string
          enum: [TASK, STATION, ARMORY, PUBLICATION]
          description: >
            En avisos de la armería (por ejemplo, Drive no disponible), target_id es el elemento de la armería; en los
            de publicación, la publicación
        target_id: { type: string }
        station_id: { type: string }
        title: { type: string }
        detail: { type: string }

    FolderRole:
      description: Papel de una carpeta de Drive
      type: string
      enum: [MATERIAL, DRAFTS, GENERATED, APPROVED, PUBLISHED, REPORTS, ORDERS]

    FolderCreationInput:
      type: object
      properties:
        base: { type: string, description: "Carpeta base de la marca (opcional), por ejemplo G:/Mi unidad/SocialHub/Litoques" }

    Folder:
      type: object
      required: [role, location, origin, available]
      properties:
        role: { $ref: "#/components/schemas/FolderRole" }
        location: { type: string, description: Ruta completa en este ordenador }
        origin:
          type: string
          enum: [BRAND, PROMOTION]
          description: Si el papel viene de la marca o lo cambia la promoción
        available: { type: boolean, description: La carpeta existe ahora en este ordenador }

    FolderList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/Folder" } }

    FolderInput:
      type: object
      required: [role, location]
      properties:
        role: { $ref: "#/components/schemas/FolderRole" }
        location: { type: string, minLength: 1, maxLength: 500 }

    FolderListInput:
      type: object
      required: [items]
      properties:
        items: { type: array, maxItems: 7, items: { $ref: "#/components/schemas/FolderInput" } }

    AiRequestType:
      description: Tipo de encargo a Claude
      type: string
      enum: [WEEKLY_SPEC, CAPTIONS, WEEKLY_BALANCE, RESEARCH, QUALITY_REVIEW, WEEKLY_PROPOSALS, PUBLER_SCHEDULE,
             PUBLISH_CHECK, CALENDAR_READ, METRICS_READ, PUBLIC_LINK]

    AiTypeModel:
      type: object
      required: [type, label, model, on_pc]
      properties:
        type: { $ref: "#/components/schemas/AiRequestType" }
        label: { type: string }
        model: { $ref: "#/components/schemas/AiModel" }
        on_pc:
          type: boolean
          description: >
            Lo hace Claude con Chrome en el PC de Raúl (carpeta «para-claude-pc»). Lo encarga SocialHub al publicar, no
            cuenta en el límite diario y no se puede pedir a mano
        automatic:
          type: boolean
          description: >
            Lo encarga SocialHub (no Raúl), no cuenta en el límite diario y no se puede pedir a mano. Incluye los de
            on_pc y otros que hace Claude en la nube, como «Enlaces públicos de imágenes»

    PublishJob:
      type: object
      required: [publication_id, status, status_label, routes, attempts, log]
      properties:
        publication_id: { type: string }
        status:
          type: string
          enum: [WORKING, HELD, RETRY_WAIT, SCHEDULED, CHECKING, MANUAL, PUBLISHED, FAILED, CANCELLED]
        status_label: { type: string }
        route: { type: string, description: Vía en uso o con la que quedó programada }
        routes:
          type: array
          description: Vías por orden, con si están configuradas
          items: { $ref: "#/components/schemas/PublishRouteState" }
        task_id: { type: string, description: Encargo a Claude en curso }
        external_id: { type: string }
        url: { type: string }
        next_try_at: { type: string, format: date-time }
        attempts: { type: integer, format: int32, description: Rondas por todas las vías }
        last_error: { type: string }
        manual_file: { type: string, description: LEEME para publicar a mano }
        log: { type: array, items: { type: string } }

    PublicationMetrics:
      type: object
      required: [publication_id, status, requested_at, attempts]
      properties:
        publication_id: { type: string }
        status: { type: string, enum: [REQUESTED, DONE, FAILED] }
        requested_at: { type: string, format: date-time }
        measured_at: { type: string, format: date-time }
        attempts: { type: integer, format: int32 }
        views: { type: integer, format: int64 }
        reach: { type: integer, format: int64 }
        likes: { type: integer, format: int64 }
        comments: { type: integer, format: int64 }
        saves: { type: integer, format: int64 }
        shares: { type: integer, format: int64 }
        note: { type: string }

    ExternalCalendar:
      type: object
      required: [items, sources]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/ExternalPost" } }
        sources: { type: array, items: { $ref: "#/components/schemas/ExternalSource" } }

    ExternalSourceId:
      type: string
      enum: [PUBLORA, PUBLER, NETWORK]

    ExternalPost:
      type: object
      required: [source, source_label, platform, at, status]
      properties:
        source: { $ref: "#/components/schemas/ExternalSourceId" }
        source_label: { type: string }
        platform: { $ref: "#/components/schemas/Platform" }
        at: { type: string, format: date-time }
        status: { type: string, enum: [SCHEDULED, PUBLISHED, FAILED] }
        text: { type: string }
        url: { type: string }
        external_id: { type: string }
        publication_id: { type: string, description: "Publicación de SocialHub a la que corresponde, si es de SocialHub" }

    ExternalSource:
      type: object
      required: [source, label]
      properties:
        source: { $ref: "#/components/schemas/ExternalSourceId" }
        label: { type: string }
        synced_at: { type: string, format: date-time, description: Última lectura buena }
        error: { type: string, description: Por qué falló la última lectura }

    InstagramStatus:
      type: object
      required: [configured]
      properties:
        configured: { type: boolean }
        key_hint: { type: string, description: "Últimos 4 caracteres de la clave" }

    InstagramKeyInput:
      type: object
      required: [key]
      properties:
        key: { type: string, minLength: 10, maxLength: 1000 }

    InstagramAccount:
      type: object
      properties:
        ig_user_id: { type: string, description: Identificador de la cuenta de Instagram (número largo) }
        username: { type: string, description: "@usuario que devolvió Meta al comprobarla" }

    InstagramAccountInput:
      type: object
      required: [ig_user_id]
      properties:
        ig_user_id: { type: string, maxLength: 40, description: Vacío para quitarla }

    InstagramBrandCheck:
      type: object
      required: [brand_id, brand_name]
      properties:
        brand_id: { type: string }
        brand_name: { type: string }
        username: { type: string }
        publishing_used: { type: integer, description: Publicaciones por la API en las últimas 24 h }
        publishing_total: { type: integer, description: Límite en 24 h }
        error: { type: string }

    InstagramCheck:
      type: object
      required: [ok, brands]
      properties:
        ok: { type: boolean, description: La clave vale y todas las marcas configuradas responden }
        name: { type: string, description: Nombre que devolvió GET /me }
        error: { type: string, description: Por qué falló la clave }
        brands: { type: array, items: { $ref: "#/components/schemas/InstagramBrandCheck" } }

    PubloraStatus:
      type: object
      required: [configured, connections]
      properties:
        configured: { type: boolean }
        key_hint: { type: string, description: "Últimos 4 caracteres de la clave" }
        connections: { type: array, items: { $ref: "#/components/schemas/PubloraConnection" } }
        error: { type: string, description: Si Publora no respondió o no aceptó la clave }

    BackupList:
      type: object
      required: [local_folder, folder_available, keep, items]
      properties:
        folder: { type: string, description: "Carpeta de copias elegida (sin ella, las copias van a la carpeta local)" }
        folder_available: { type: boolean, description: La carpeta elegida existe (false si no hay carpeta elegida) }
        local_folder: { type: string, description: Carpeta local de SocialHub para las copias }
        keep: { type: integer, description: Cuántas copias se guardan en cada carpeta }
        items: { type: array, items: { $ref: "#/components/schemas/Backup" } }

    Backup:
      type: object
      required: [name, created_at, size_bytes, kind, local]
      properties:
        name: { type: string, example: socialhub-2026-11-08-1500-diaria.zip }
        created_at: { type: string, format: date-time }
        size_bytes: { type: integer, format: int64 }
        kind: { type: string, enum: [DAILY, MANUAL, BEFORE_RESTORE] }
        local: { type: boolean, description: Está en la carpeta local y no en la elegida }

    BackupFolderInput:
      type: object
      properties:
        folder: { type: string, description: Ruta de la carpeta; vacía para quitarla }

    RestorationInput:
      type: object
      required: [name, confirmation]
      properties:
        name: { type: string }
        confirmation: { type: string, description: El nombre de la copia escrito de nuevo }

    Restoration:
      type: object
      required: [restored, safety_backup, halted_reason]
      properties:
        restored: { type: string }
        safety_backup: { type: string, description: Copia de lo que había antes de restaurar }
        halted_reason: { type: string }

    PubloraConnection:
      type: object
      required: [id, platform, label, usable]
      properties:
        id: { type: string, description: "Identificador en Publora («instagram-123»)" }
        platform: { type: string, description: "Red en Publora (instagram, tiktok…)" }
        label: { type: string }
        usable: { type: boolean, description: "false si Publora pide volver a conectarla" }

    PubloraKeyInput:
      type: object
      required: [key]
      properties:
        key: { type: string, minLength: 10, maxLength: 200 }

    PubloraAccount:
      type: object
      required: [platform, connection_id, label]
      properties:
        platform: { $ref: "#/components/schemas/Platform" }
        connection_id: { type: string }
        label: { type: string }

    PubloraAccountList:
      type: object
      required: [items, dismissed]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/PubloraAccount" } }
        dismissed:
          type: boolean
          description: Raúl ha marcado «No uso Publora» para esta marca (no se le recomienda conectarla)

    PubloraDismissedInput:
      type: object
      required: [dismissed]
      properties:
        dismissed: { type: boolean }

    PubloraAccountInput:
      type: object
      required: [platform, connection_id]
      properties:
        platform: { $ref: "#/components/schemas/Platform" }
        connection_id: { type: string, minLength: 1, maxLength: 200 }

    PubloraAccountListInput:
      type: object
      required: [items]
