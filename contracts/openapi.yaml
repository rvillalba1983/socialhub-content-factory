              after_caption: { type: string }
              before_hashtags: { type: string }
              after_hashtags: { type: string }
              created_at: { type: string, format: date-time }
        published:
          type: array
          description: Aprobadas, programadas o publicadas de las últimas 8 semanas
          items: { $ref: "#/components/schemas/Publication" }

    Brand:
      type: object
      required: [id, name, handle, color, demo]
      properties:
        id: { type: string }
        name: { type: string }
        handle: { type: string }
        color: { type: string, pattern: "^#[0-9A-Fa-f]{6}$" }
        demo: { type: boolean }

    AppMode:
