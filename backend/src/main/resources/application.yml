spring:
  application:
    name: socialhub
  threads:
    virtual:
      enabled: true
  flyway:
    # Las migraciones las aplica SocialHub a las dos bases de datos (real y demo); ver DatabaseConfiguration
    enabled: false
  jpa:
    # Las consultas se hacen en los servicios; nunca al pintar la respuesta
    open-in-view: false
    hibernate:
      # El esquema lo crea Flyway; Hibernate solo comprueba que coincide
      ddl-auto: validate
    properties:
      hibernate:
        # Carga por lotes de colecciones y relaciones (evita el problema N+1)
        default_batch_fetch_size: 50
        jdbc:
          batch_size: 50
        order_inserts: true
        order_updates: true
        # Envers: tablas *_aud y revinfo
        envers:
          audit_table_suffix: _aud
  mvc:
    problemdetails:
      enabled: true

server:
  # Solo se escucha dentro del propio ordenador
  address: 127.0.0.1
  port: 8686
  error:
    include-message: always

socialhub:
  logging:
    # Qué se tapa en los registros; es la misma expresión que SecretRedactor (una prueba lo comprueba)
    redaction-regex: '(?i)(?:\b([\w.-]*(?:token|secret|passw(?:or)?d|pwd|api[_-]?key|apikey|authorization|credentials?|private[_-]?key)[\x22\x27]?\s*[:=]\s*[\x22\x27]?(?:(?:bearer|basic)\s+)?)[^\s&,;\x22\x27)\]]+|([?&](?:key|sig|signature|code|auth|apikey|api_key)=)[^&\s\x22\x27]+|\b((?:bearer|basic)\s+)[A-Za-z0-9._~+/=-]+|\b(?:AIza[\w-][\w-][\w-][\w-][\w-][\w-][\w-][\w-][\w-][\w-][\w-][\w-][\w-][\w-][\w-][\w-][\w-][\w-][\w-][\w-][\w-]*|ya29\.[\w.-]+|1//[\w.-][\w.-][\w.-][\w.-][\w.-][\w.-][\w.-][\w.-][\w.-][\w.-][\w.-][\w.-][\w.-][\w.-][\w.-][\w.-][\w.-][\w.-][\w.-][\w.-][\w.-]*|sk-[\w-][\w-][\w-][\w-][\w-][\w-][\w-][\w-][\w-][\w-][\w-][\w-][\w-][\w-][\w-][\w-][\w-][\w-][\w-][\w-][\w-]*|gh[pousr]_\w\w\w\w\w\w\w\w\w\w\w\w\w\w\w\w\w\w\w\w\w*|xox[abprs]-[\w-][\w-][\w-][\w-][\w-][\w-][\w-][\w-][\w-][\w-][\w-]*|EAA\w\w\w\w\w\w\w\w\w\w\w\w\w\w\w\w\w\w\w\w\w\w\w\w\w\w\w\w\w\w\w*|eyJ[\w-][\w-][\w-][\w-][\w-][\w-][\w-][\w-][\w-]*\.[\w-][\w-][\w-][\w-][\w-][\w-][\w-][\w-][\w-]*\.[\w-]*))'
    redaction-replacement: '$1$2$3***'
  # Modo con el que arranca la primera vez; después se recuerda el último elegido (archivo «mode»)
  default-mode: REAL
  # Vacío = carpeta estándar del usuario (%LOCALAPPDATA%\SocialHub, ~/Library/Application Support/SocialHub…)
  data-dir: ""
  postgres:
    port: 54329
    start-timeout-seconds: 90
    # Vacío = binarios incluidos en la aplicación
    binaries-dir: ""
    runtime-dir: ""
  demo:
    # Fase 2: solo hay datos de ejemplo, marcados como tales
    enabled: true
    # Simulador: hace avanzar las tareas de ejemplo (solo en modo demo)
    simulate: true
    tick-millis: 1500

  operations:
    # Cada cuánto se guardan en la base de datos las operaciones externas observadas
    flush-millis: 2000
    # Limpieza diaria de las de más de 30 días
    purge-cron: "0 30 3 * * *"

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  tracing:
    sampling:
      # Aplicación personal: se traza todo
      probability: 1.0
  # Sin exportar trazas a ningún servidor externo; solo identificadores en los registros
  otlp:
    tracing:
      export:
        enabled: false

logging:
  pattern:
    correlation: "[%X{traceId:-},%X{spanId:-}] "
    # Registro en archivo (socialhub.log, solo con SocialHub instalado): igual que el de Spring pero con las claves,
    # tokens y contraseñas tapados, también en las trazas de error. La expresión está en una sola propiedad
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} %5p [%t] ${logging.pattern.correlation}%-40.40logger{39} : %replace(%m){'${socialhub.logging.redaction-regex}','${socialhub.logging.redaction-replacement}'}%n%replace(%wEx){'${socialhub.logging.redaction-regex}','${socialhub.logging.redaction-replacement}'}"
  logback:
    rollingpolicy:
      # Para que no llene el disco: 10 MB por archivo, 30 días y un tope de 300 MB entre todos (los viejos, comprimidos)
      max-file-size: 10MB
      max-history: 30
      total-size-cap: 300MB
      clean-history-on-start: true
  level:
    root: INFO
